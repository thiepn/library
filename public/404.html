<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Library</title>
    <script>
      (function () {
        var base = '/library';
        var path = location.pathname;
        if (!path.startsWith(base)) {
          location.replace(base + '/');
          return;
        }
        var target = base + '/?p=' + encodeURIComponent(path + location.search) + location.hash;
        location.replace(target);
      })();
    </script>
  </head>
  <body></body>
</html>
