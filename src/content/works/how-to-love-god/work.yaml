description: How to Love God is a biblical theology, practical discipleship guide, and pastoral resource on wholehearted love for God. It traces the greatest commandment through God’s prior grace in Christ, the Spirit’s renewing work, affection and obedience, Scripture and prayer, worship and repentance, ordinary life, suffering, mission, spiritual warfare, Christian community, and lifelong hope.
