description: How to Love God is a biblical theology, practical discipleship guide, and pastoral resource on wholehearted love for God. Beginning with God's self-revelation and prior grace in Christ, it explores assurance, obedience, desire, Scripture, prayer, gathered worship, spiritual dryness, suffering, rival loves, spiritual warfare, relationships, church authority, witness, cross-cultural mission, perseverance, and new creation.
