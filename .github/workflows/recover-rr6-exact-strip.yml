name: Recover RR6 exact-strip tap mapping

on:
  push:
    branches:
      - 'autopilot/deploy-recovery-35196958061'
    paths:
      - '.github/workflows/recover-rr6-exact-strip.yml'

permissions:
  contents: write

concurrency:
  group: recover-rr6-exact-strip-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Setup pnpm and Node
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          version: 11.21.0
          runtime: node@22.12.0
          install: false
          cache: true

      - name: Patch exact paginated-strip precedence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/lib/reader/engines/epubjs.ts')
          text = path.read_text()
          needle = """  const localWidth = Math.max(1, win.innerWidth || doc.documentElement?.clientWidth || 1);\n  const localRatio = clampRatio(clientX / localWidth);\n\n  try {\n"""
          replacement = """  const localWidth = Math.max(1, win.innerWidth || doc.documentElement?.clientWidth || 1);\n  const localRatio = clampRatio(clientX / localWidth);\n\n  // EPUB.js injects a numeric viewport width for one visible rendition page. When the\n  // child viewport is an exact integer strip of those pages, that geometry is stronger\n  // than parent/screen heuristics: retained staged RR6 evidence shows a 1480px child\n  // viewport containing four 370px pages, translated exactly three page widths behind\n  // the visible reader. Normalize against that proven page width before consulting\n  // coordinate-space fallbacks so a physical center tap cannot be mistaken for an edge.\n  {\n    const viewportMeta = doc.querySelector<HTMLMetaElement>('meta[name=\\\"viewport\\\"]')?.getAttribute('content') ?? '';\n    const viewportWidthMatch = viewportMeta.match(/(?:^|[,\\s])width\\s*=\\s*(\\d+(?:\\.\\d+)?)/i);\n    const declaredViewportWidth = viewportWidthMatch?.[1]\n      ? Number.parseFloat(viewportWidthMatch[1])\n      : Number.NaN;\n    if (Number.isFinite(declaredViewportWidth) && declaredViewportWidth > 1 && Number.isFinite(clientX)) {\n      const pageCount = localWidth / declaredViewportWidth;\n      const roundedPageCount = Math.round(pageCount);\n      if (roundedPageCount >= 2 && Math.abs(pageCount - roundedPageCount) <= 0.02) {\n        const pageTolerance = Math.max(3, declaredViewportWidth * 0.03);\n        if (clientX >= -pageTolerance && clientX <= declaredViewportWidth + pageTolerance) {\n          return clampRatio(clientX / declaredViewportWidth);\n        }\n        const wrappedX = ((clientX % declaredViewportWidth) + declaredViewportWidth) % declaredViewportWidth;\n        return clampRatio(wrappedX / declaredViewportWidth);\n      }\n    }\n  }\n\n  try {\n"""
          if needle not in text:
              raise SystemExit('expected physicalTapXRatio insertion point not found')
          path.write_text(text.replace(needle, replacement, 1))
          PY

          git diff --check
          pnpm install --frozen-lockfile
          pnpm check
          pnpm test:reader

      - name: Commit repair and self-remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/recover-rr6-exact-strip.yml
          git add src/lib/reader/engines/epubjs.ts
          git commit -m 'fix: prioritize proven EPUB page-strip tap geometry'
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
