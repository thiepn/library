name: Recover staged RR6 touch ownership

on:
  push:
    branches:
      - 'autopilot/deploy-recovery-35282266128'
    paths:
      - '.github/workflows/recover-rr6-click-35282266128.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Patch EPUB touch ownership without weakening RR6
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/lib/reader/engines/epubjs.ts')
          text = path.read_text(encoding='utf-8')

          y_start_marker = "      const yCandidates = [y];"
          y_end_marker = "\n\n      // Chromium can report event.target from an underlying column"
          if text.count(y_start_marker) != 1:
              raise SystemExit(f'iframe-local Y start: expected one match, found {text.count(y_start_marker)}')
          y_start = text.index(y_start_marker)
          y_end = text.index(y_end_marker, y_start)
          new_y = (
              "      // DOM client coordinates delivered inside the EPUB iframe are already local to that\n"
              "      // document. Mixing in the parent-frame top offset can falsely project the same tap onto\n"
              "      // an unrelated link in another vertical position, which makes a reader-owned center tap\n"
              "      // look interactive. Keep hit testing in the iframe's own coordinate space.\n"
              "      const visibleColumnY = y;"
          )
          text = text[:y_start] + new_y + text[y_end:]

          old_rect_y = "&& yCandidates.some((candidateY) => candidateY >= rect.top - 1 && candidateY <= rect.bottom + 1),"
          new_rect_y = (
              "&& visibleColumnY >= rect.top - 1\n"
              "              && visibleColumnY <= rect.bottom + 1,"
          )
          if text.count(old_rect_y) != 1:
              raise SystemExit(f'visible-column rect Y: expected one match, found {text.count(old_rect_y)}')
          text = text.replace(old_rect_y, new_rect_y, 1)

          old_touch_dedupe = (
              "      if (performance.now() - this.lastTouchTapAt < COMPATIBILITY_CLICK_DEDUPE_MS) {\n"
              "        event.preventDefault();\n"
              "        return;\n"
              "      }"
          )
          new_touch_dedupe = (
              "      if (performance.now() - this.lastTouchTapAt < COMPATIBILITY_CLICK_DEDUPE_MS) {\n"
              "        event.preventDefault();\n"
              "        event.stopImmediatePropagation();\n"
              "        return;\n"
              "      }"
          )
          if text.count(old_touch_dedupe) != 1:
              raise SystemExit(f'touch compatibility click: expected one match, found {text.count(old_touch_dedupe)}')
          text = text.replace(old_touch_dedupe, new_touch_dedupe, 1)

          old_pointer_dedupe = (
              "      if (duplicateOfHandledPointer) {\n"
              "        event.preventDefault();\n"
              "        return;\n"
              "      }"
          )
          new_pointer_dedupe = (
              "      if (duplicateOfHandledPointer) {\n"
              "        event.preventDefault();\n"
              "        event.stopImmediatePropagation();\n"
              "        return;\n"
              "      }"
          )
          if text.count(old_pointer_dedupe) != 1:
              raise SystemExit(f'pointer compatibility click: expected one match, found {text.count(old_pointer_dedupe)}')
          text = text.replace(old_pointer_dedupe, new_pointer_dedupe, 1)

          old_listener = "    doc.addEventListener('click', handleClick);"
          new_listener = (
              "    // Capture reader-owned compatibility clicks before EPUB.js link handlers can act on a hidden-column target.\n"
              "    doc.addEventListener('click', handleClick, { capture: true });"
          )
          if text.count(old_listener) != 1:
              raise SystemExit(f'capture click listener: expected one match, found {text.count(old_listener)}')
          text = text.replace(old_listener, new_listener, 1)

          path.write_text(text, encoding='utf-8')
          PY
          git diff --check

      - name: Commit repair and self-remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/recover-rr6-click-35282266128.yml
          git add src/lib/reader/engines/epubjs.ts
          git commit -m 'Fix staged RR6 EPUB touch click ownership'
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
