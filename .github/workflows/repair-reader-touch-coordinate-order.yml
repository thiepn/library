name: Repair reader touch coordinate order

on:
  push:
    branches:
      - 'repair/reader-touch-visible-ratio-34751544799'
    paths:
      - '.github/workflows/repair-reader-touch-coordinate-order.yml'

permissions:
  contents: write

concurrency:
  group: repair-reader-touch-coordinate-order-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Prefer visible viewport-local touch coordinates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/lib/reader/engines/epubjs.ts')
          text = path.read_text()
          old = """    const tolerance = Math.max(2, viewportRect.width * 0.02);
              const parentX = frameRect.left + clientX;
              if (parentX >= viewportRect.left - tolerance && parentX <= viewportRect.right + tolerance) {
                return clampRatio((parentX - viewportRect.left) / viewportRect.width);
              }

              // Some touch engines normalize iframe clientX back to the visible browsing-context width
              // even while the frame element itself remains translated across the paginated section.
              if (clientX >= -tolerance && clientX <= viewportRect.width + tolerance) {
                return clampRatio(clientX / viewportRect.width);
              }
          """
          new = """    const tolerance = Math.max(2, viewportRect.width * 0.02);
              // A clientX that already fits the visible browsing-context width is viewport-local.
              // Prefer it before applying the translated frame offset; otherwise a partially translated
              // oversized iframe can shift a real right/center/left tap into the wrong navigation zone.
              if (clientX >= -tolerance && clientX <= viewportRect.width + tolerance) {
                return clampRatio(clientX / viewportRect.width);
              }

              const parentX = frameRect.left + clientX;
              if (parentX >= viewportRect.left - tolerance && parentX <= viewportRect.right + tolerance) {
                return clampRatio((parentX - viewportRect.left) / viewportRect.width);
              }
          """
          if old not in text:
              raise SystemExit('Expected touch-coordinate block was not found; refusing unsafe patch.')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit repair and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/repair-reader-touch-coordinate-order.yml
          git add src/lib/reader/engines/epubjs.ts
          git commit -m 'fix: prefer viewport-local touch coordinates'
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
