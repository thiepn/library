name: Recover staged RR6 strip tap mapping

on:
  push:
    branches:
      - 'autopilot/deploy-recovery-35212466938-v2'
    paths:
      - '.github/workflows/recover-rr6-strip-tap.yml'

permissions:
  contents: write

concurrency:
  group: recover-rr6-strip-tap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Setup pnpm and Node
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          version: 11.21.0
          runtime: node@22.12.0
          install: false
          cache: true

      - name: Patch exact multi-page iframe tap geometry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/lib/reader/engines/epubjs.ts')
          text = path.read_text()
          lines = text.splitlines()
          s6 = ' ' * 6
          s8 = ' ' * 8
          s10 = ' ' * 10
          needle = s6 + "// Only after exact frame projection and an already-visible clientX have failed,"
          matches = [i for i, line in enumerate(lines) if line == needle]
          if len(matches) != 1:
              raise SystemExit(f'Expected exactly one tap-geometry insertion point, found {len(matches)}')
          i = matches[0]
          insertion = [
              s6 + "// Hosted Gutenberg chapters can expose an iframe-local viewport that is an exact",
              s6 + "// integer strip of the visible reader width without declaring a numeric viewport",
              s6 + "// meta width. Chromium touch events can then report strip-local clientX. Only wrap",
              s6 + "// against the parent reader width when an exact integer-page strip proves that",
              s6 + "// geometry, avoiding guesses when EPUB column gaps make page stride ambiguous.",
              s6 + "if (Number.isFinite(clientX)) {",
              s8 + "const pageCount = localWidth / visibleWidth;",
              s8 + "const roundedPageCount = Math.round(pageCount);",
              s8 + "if (roundedPageCount >= 2 && Math.abs(pageCount - roundedPageCount) <= 0.02) {",
              s10 + "const wrappedX = ((clientX % visibleWidth) + visibleWidth) % visibleWidth;",
              s10 + "return visibleRatio(wrappedX);",
              s8 + "}",
              s6 + "}",
              "",
          ]
          lines[i:i] = insertion
          path.write_text('\n'.join(lines) + '\n')
          PY
          git diff --check
          git diff -- src/lib/reader/engines/epubjs.ts

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Certify source and build
        run: |
          set -euo pipefail
          pnpm certify:source
          pnpm test:reader
          pnpm build

      - name: Commit recovery and self-remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/recover-rr6-strip-tap.yml
          git add src/lib/reader/engines/epubjs.ts
          git commit -m 'Fix RR6 multi-page iframe tap normalization'
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
