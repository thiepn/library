name: Refresh Astro 7 markdown lockfile

on:
  push:
    branches:
      - 'autopilot/public-domain-*'
    paths:
      - '.github/workflows/refresh-astro7-markdown-lock.yml'
      - 'package.json'
      - 'astro.config.mjs'

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Setup pnpm and Node
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          version: 11.21.0
          runtime: node@22.12.0
          install: false
          cache: true

      - name: Regenerate lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Validate Astro 7 migration
        run: |
          pnpm install --frozen-lockfile
          pnpm check
          pnpm audit --prod --audit-level=high

      - name: Commit refreshed lockfile
        run: |
          set -euo pipefail
          if git diff --quiet -- pnpm-lock.yaml; then
            echo 'No lockfile changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git commit -m 'chore: refresh lockfile for Astro 7 markdown processor'
          git push origin HEAD
