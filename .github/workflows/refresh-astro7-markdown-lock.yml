name: Refresh Astro 7 markdown lockfile

on:
  push:
    branches:
      - 'autopilot/public-domain-*'
    paths:
      - '.github/workflows/refresh-astro7-markdown-lock.yml'
      - 'package.json'
      - 'astro.config.mjs'

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Setup pnpm and Node
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          version: 11.21.0
          runtime: node@22.12.0
          install: false
          cache: true

      - name: Regenerate lockfile and certify Astro 7 migration
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --lockfile-only --no-frozen-lockfile
          git diff --exit-code -- package.json pnpm-workspace.yaml astro.config.mjs
          pnpm install --frozen-lockfile
          pnpm audit --prod --audit-level=high
          pnpm build

      - name: Commit generated lockfile and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/refresh-astro7-markdown-lock.yml
          git add pnpm-lock.yaml
          git commit -m 'chore: certify Astro 7 markdown migration lockfile'
          git push origin HEAD
