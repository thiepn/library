name: RR9 Offline Test Fix

on:
  push:
    branches: [rr9-security-v1-launch]
    paths:
      - '.github/workflows/rr9-offline-test-fix.yml'

permissions:
  contents: write

concurrency:
  group: rr9-offline-test-fix
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout RR9 branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: rr9-security-v1-launch
          fetch-depth: 0

      - name: Replace inert _headers acceptance with real host-policy contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/e2e/storage-reliability.spec.ts')
          text = path.read_text(encoding='utf-8')
          needle = "const headers = await readFile(path.resolve('public/_headers'), 'utf8');"
          index = text.find(needle)
          if index < 0:
              raise SystemExit('stale public/_headers assertion was not found')

          start = text.rfind('\ntest(', 0, index)
          if start < 0:
              raise SystemExit('could not locate enclosing Playwright test')
          start += 1
          end = text.find('\ntest(', index)
          if end < 0:
              end = len(text)

          replacement = r'''test('keeps service worker scope and host security boundaries source-checkable', async () => {
            const [serviceWorker, baseLayout, readerLayout, verifier] = await Promise.all([
              readFile(path.resolve('public/service-worker.js'), 'utf8'),
              readFile(path.resolve('src/layouts/BaseLayout.astro'), 'utf8'),
              readFile(path.resolve('src/layouts/EpubReaderLayout.astro'), 'utf8'),
              readFile(path.resolve('scripts/verify-production.mjs'), 'utf8'),
            ]);

            expect(serviceWorker).toContain('const scopeUrl = new URL(self.registration.scope)');
            expect(serviceWorker).toContain('url.origin === scopeUrl.origin');
            expect(serviceWorker).toContain('if (!isSameOriginScoped(url)) return;');
            expect(serviceWorker).toContain("if (request.method !== 'GET') return;");
            expect(serviceWorker).toContain("request.headers.get('range')");

            for (const layout of [baseLayout, readerLayout]) {
              expect(layout).toContain('http-equiv="Content-Security-Policy"');
              expect(layout).toContain("default-src 'self'");
              expect(layout).toContain("object-src 'none'");
              expect(layout).toContain("script-src 'self'");
              expect(layout).toContain('name="referrer" content="no-referrer"');
            }

            expect(verifier).toContain('CSP_META_FALLBACK_PRESENT');
            expect(verifier).toContain('release-identity.json');
            expect(verifier).toContain('Production source identity mismatch');
          });
          '''
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY

      - name: Remove one-shot helper and commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/rr9-offline-test-fix.yml
          git add tests/e2e/storage-reliability.spec.ts
          git commit -m 'Align RR5 host-policy acceptance with RR9'
          git push origin HEAD:rr9-security-v1-launch
