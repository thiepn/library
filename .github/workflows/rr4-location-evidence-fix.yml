name: RR4 Apply EPUB Relocation Probe

on:
  push:
    branches: [release/rr4-performance-memory]
    paths:
      - 'scripts/rr4-location-evidence-fix.mjs'
      - '.github/workflows/rr4-location-evidence-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: release/rr4-performance-memory
          fetch-depth: 0

      - name: Apply exact EPUB relocation probe
        run: node scripts/rr4-location-evidence-fix.mjs

      - name: Commit non-workflow correction
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git restore --source=HEAD --staged --worktree .github/workflows/rr4-location-evidence-fix.yml
          git diff --cached --quiet && exit 0
          git commit -m 'RR4 measure exact EPUB relocation and resume'
          git push origin HEAD:release/rr4-performance-memory
