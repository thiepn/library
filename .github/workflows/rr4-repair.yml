name: RR4 Repair Performance Patch

on:
  push:
    branches: [release/rr4-performance-memory]
    paths:
      - 'scripts/rr4-repair.mjs'
      - '.github/workflows/rr4-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: release/rr4-performance-memory
          fetch-depth: 0

      - name: Apply scoped RR4 repair and implementation
        run: node scripts/rr4-repair.mjs

      - name: Commit RR4 implementation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'RR4 implement performance memory budgets'
          git push origin HEAD:release/rr4-performance-memory
