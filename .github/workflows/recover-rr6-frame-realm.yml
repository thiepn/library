name: Recover RR6 cross-realm touch geometry

on:
  push:
    branches:
      - autopilot/recovery-rr6-touch-34751544799
    paths:
      - .github/workflows/recover-rr6-frame-realm.yml

permissions:
  contents: write

concurrency:
  group: recover-rr6-frame-realm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Setup pnpm and Node
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          version: 11.21.0
          runtime: node@22.12.0
          install: false
          cache: true

      - name: Remove cross-realm instanceof dependency
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/lib/reader/engines/epubjs.ts')
          source = path.read_text()
          old = """    const frame = win.frameElement;
              const viewport = frame instanceof Element
                ? frame.closest<HTMLElement>('[data-reader-viewport]')
                : null;
          """
          new = """    const frame = win.frameElement;
              const viewport = frame && typeof frame.closest === 'function'
                ? frame.closest<HTMLElement>('[data-reader-viewport]')
                : null;
          """
          if source.count(old) != 1:
              raise SystemExit('Expected exactly one cross-realm frame guard to patch.')
          path.write_text(source.replace(old, new))
          PY
          git diff --check
          git diff -- src/lib/reader/engines/epubjs.ts

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Install mobile browser engines
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Build static Library
        run: pnpm build

      - name: Run exact RR6 tap-zone recovery tests
        run: pnpm exec playwright test tests/e2e/reader-tap-zones.spec.ts --project=chromium-phone --project=webkit-phone

      - name: Upload failed recovery evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rr6-frame-realm-recovery-${{ github.run_id }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit verified source repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/reader/engines/epubjs.ts
          git commit -m 'fix: normalize EPUB touch geometry across realms'
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
