name: Repair RR6 staged tap probe

on:
  push:
    branches:
      - 'autopilot/deploy-recovery-35232272270'
    paths:
      - '.github/workflows/repair-rr6-staged-tap-probe.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Patch staged physical-tap target probe
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/e2e/reader-tap-zones.spec.ts')
          text = path.read_text()
          old = '''  const pageX = viewportBox.x + viewportBox.width * xRatio;
          const candidates = [preferredYRatio, ...SAFE_TAP_Y_RATIOS.filter((ratio) => ratio !== preferredYRatio)];
          const inspected: string[] = [];

          for (const yRatio of candidates) {
            const pageY = viewportBox.y + viewportBox.height * yRatio;
            const frameX = pageX - iframeBox.x;
            const frameY = pageY - iframeBox.y;
'''
          new = '''  const pageX = viewportBox.x + viewportBox.width * xRatio;
          const candidates = [preferredYRatio, ...SAFE_TAP_Y_RATIOS.filter((ratio) => ratio !== preferredYRatio)];
          const inspected: string[] = [];
          const shell = page.locator('[data-reader-shell]');
          const [locationPageRaw, locationTotalRaw] = await Promise.all([
            shell.getAttribute('data-reader-location-page'),
            shell.getAttribute('data-reader-location-total'),
          ]);
          const locationPage = Number.parseInt(locationPageRaw ?? '', 10);
          const locationTotal = Number.parseInt(locationTotalRaw ?? '', 10);
          const pageStride = locationTotal >= 2 ? iframeBox.width / locationTotal : 0;
          const geometryTolerance = Math.max(3, viewportBox.width * 0.03);
          const unshiftedMultiPageStrip = Number.isFinite(locationPage)
            && locationPage >= 1
            && locationPage <= locationTotal
            && iframeBox.width > viewportBox.width * 1.25
            && Math.abs(pageStride - viewportBox.width) <= geometryTolerance
            && Math.abs(iframeBox.x - viewportBox.x) <= geometryTolerance;

          for (const yRatio of candidates) {
            const pageY = viewportBox.y + viewportBox.height * yRatio;
            // In hosted paginated EPUBs the iframe itself can remain anchored at the viewport
            // while its document is an N-page horizontal strip. Chromium's physical hit test
            // targets the currently displayed strip page, not child x=visibleX. Probe that exact
            // page before tapping so publication links always retain precedence over reader chrome.
            const frameX = pageX - iframeBox.x
              + (unshiftedMultiPageStrip ? (locationPage - 1) * pageStride : 0);
            const frameY = pageY - iframeBox.y;
'''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one tap-probe block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Setup pnpm and Node
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          version: 11.21.0
          runtime: node@22.12.0
          install: false
          cache: true

      - name: Verify recovery patch
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm build

      - name: Commit recovery and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/repair-rr6-staged-tap-probe.yml
          git add tests/e2e/reader-tap-zones.spec.ts
          git commit -m 'test: map staged RR6 taps to visible strip page'
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
