name: Refresh SSO lockfile once

on:
  push:
    branches: [first-party-sso-client]
    paths:
      - ".github/workflows/refresh-sso-lockfile-once.yml"
      - "package.json"

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: first-party-sso-client
      - run: corepack enable
      - run: pnpm install --lockfile-only
      - name: Commit generated lockfile
        shell: bash
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "Refresh shared THIEPN account-session lockfile"
          git push origin HEAD:first-party-sso-client
