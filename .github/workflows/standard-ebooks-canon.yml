name: Standard Ebooks Canon

on:
  workflow_run:
    workflows: ['Curated Canon Overhaul']
    types: [completed]
  push:
    branches: [main]
    paths:
      - '.github/standard-ebooks-canon-trigger'
  workflow_dispatch:
    inputs:
      max_books:
        description: Maximum missing curated books to add from Standard Ebooks
        required: false
        default: '80'

permissions:
  contents: write

concurrency:
  group: standard-ebooks-canon
  cancel-in-progress: true

jobs:
  ingest:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      added_count: ${{ steps.ingest.outputs.added_count }}
      work_ids: ${{ steps.ingest.outputs.work_ids }}
      branch: ${{ steps.checkpoint.outputs.branch }}
    steps:
      - name: Checkout Library
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Setup pnpm and Node
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          version: 11.21.0
          runtime: node@22.12.0
          install: false
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate secondary-source tooling
        run: |
          python3 -m py_compile \
            scripts/public-domain/run-standardebooks.py \
            scripts/public-domain/catalog_metadata.py \
            scripts/public-domain/cover_pipeline.py \
            scripts/public-domain/cover_job.py \
            scripts/public-domain/finalize-cover-release.py

      - name: Ingest missing curated Standard Ebooks editions
        id: ingest
        env:
          MAX_BOOKS: ${{ github.event.inputs.max_books || '80' }}
        run: |
          set -euo pipefail
          python3 scripts/public-domain/run-standardebooks.py \
            --max-books "$MAX_BOOKS" \
            --max-checks 220

      - name: Checkpoint secondary-source manifests
        id: checkpoint
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          branch="autopilot/standard-ebooks-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git add \
            src/content/works \
            src/publications/releases \
            src/publications/public-domain-ledger.json \
            src/publications/curated-canon-status.json \
            public/covers/public-domain
          if ! git diff --cached --quiet; then
            git commit -m "Standard Ebooks checkpoint: stage curated public-domain works"
          fi
          git push origin "HEAD:$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Persist staged EPUB payload
        if: steps.ingest.outputs.added_count != '0'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: standard-ebooks-staging-${{ github.run_id }}
          path: .public-domain-staging
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  finalize:
    needs: ingest
    if: needs.ingest.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_BUCKET: thiepn-library-publications
      COVER_IMAGE_MODEL: gpt-image-2
      COVER_IMAGE_QUALITY: medium
      COVER_IMAGE_SIZE: 1024x1536
      CHECKPOINT_BRANCH: ${{ needs.ingest.outputs.branch }}
      ADDED_COUNT: ${{ needs.ingest.outputs.added_count }}
    steps:
      - name: Checkout checkpoint
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ needs.ingest.outputs.branch }}

      - name: Setup pnpm and Node
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          version: 11.21.0
          runtime: node@22.12.0
          install: false
          cache: true

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          python3 -m pip install --disable-pip-version-check 'Pillow==11.3.0'

      - name: Require publication credentials
        if: env.ADDED_COUNT != '0'
        run: |
          set -euo pipefail
          test -n "${OPENAI_API_KEY:-}"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${R2_BUCKET:-}"

      - name: Restore staged EPUB payload
        if: env.ADDED_COUNT != '0'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: standard-ebooks-staging-${{ github.run_id }}
          path: .public-domain-staging

      - name: Generate THIEPN covers and embed them
        if: env.ADDED_COUNT != '0'
        run: python3 scripts/public-domain/cover_job.py --new-staging

      - name: Finalize immutable release versions
        if: env.ADDED_COUNT != '0'
        run: python3 scripts/public-domain/finalize-cover-release.py --mode new

      - name: Audit curated canon coverage
        run: python3 scripts/public-domain/audit-canon.py

      - name: Certify Library
        run: pnpm release:certify

      - name: Upload immutable EPUBs to R2 and verify readback
        if: env.ADDED_COUNT != '0'
        run: |
          set -euo pipefail
          mkdir -p /tmp/se-readback
          python3 - <<'PY' > /tmp/se-artifacts.tsv
          import json
          from pathlib import Path
          items = json.loads(Path('.public-domain-staging/artifacts.json').read_text())
          for item in items:
              print('\t'.join([
                  item['localPath'],
                  item['r2Key'],
                  str(item['sizeBytes']),
                  item['sha256'],
              ]))
          PY
          while IFS=$'\t' read -r local_path key bytes hash; do
            filename="$(basename "$local_path")"
            readback="/tmp/se-readback/$filename"
            pnpm exec wrangler r2 object put "$R2_BUCKET/$key" --file="$local_path" --remote
            pnpm exec wrangler r2 object get "$R2_BUCKET/$key" --file="$readback" --remote
            test "$(stat -c %s "$readback")" = "$bytes"
            printf '%s  %s\n' "$hash" "$readback" | sha256sum -c -
          done < /tmp/se-artifacts.tsv

      - name: Commit finalized secondary-source releases
        run: |
          set -euo pipefail
          rm -rf .public-domain-staging
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/content/works \
            src/publications/releases \
            src/publications/public-domain-ledger.json \
            public/covers/public-domain
          if ! git diff --cached --quiet; then
            git commit -m "Library: finalize Standard Ebooks curated releases"
            git push origin "HEAD:$CHECKPOINT_BRANCH"
          fi

      - name: Promote certified checkpoint to main
        run: |
          set -euo pipefail
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            git rebase origin/main
          fi
          git push origin HEAD:main
          git push origin --delete "$CHECKPOINT_BRANCH" || true
