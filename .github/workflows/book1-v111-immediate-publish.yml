name: Book 1 1.1.1 immediate publication
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/book1-v111-immediate-publish.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: book1-v111-immediate-only
  cancel-in-progress: false
jobs:
  book:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: github-pages
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_BUCKET: thiepn-library-publications
      PUBLIC_THIEPN_ACCOUNT_PUBLISHABLE_KEY: sb_publishable_1rZzRPzfLMaAH5pIgCwIjA_19UPMIsR
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require exact registered edition and immutable 1.1.0
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^  activeRelease: 1.1.1$' src/content/works/how-to-love-god/work.yaml
          test -s src/publications/releases/how-to-love-god/1.1.1.yaml
          test -s src/publications/releases/how-to-love-god/1.1.0.yaml
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          version: 11.21.0
          runtime: node@22.12.0
          install: false
          cache: true
      - name: Install frozen first-party dependencies
        run: pnpm install --frozen-lockfile
      - name: Build current Library catalog and reader
        run: pnpm build
      - name: Stage all unchanged previous editions and new 1.1.1 assets
        run: pnpm stage:media
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: true
      - name: Upload exact site with 1.1.1
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          name: book1-v111-pages
          path: ./dist/library
      - name: Publish corrected book on GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          artifact_name: book1-v111-pages
