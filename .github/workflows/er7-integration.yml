name: ER7 Integration

on:
  push:
    branches: [er7-real-device-ux]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: er7-integration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: er7-real-device-ux
          fetch-depth: 0

      - name: Apply deterministic ER7 patch
        run: node scripts/er7-apply.mjs

      - name: Setup pnpm and Node
        uses: pnpm/setup@v2
        with:
          version: 11.21.0
          runtime: node@22.12.0
          install: false
          cache: true

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Check patch formatting
        run: git diff --check

      - name: Run full release certification
        run: pnpm release:certify

      - name: Remove temporary integration assets
        run: git rm -f scripts/er7-apply.mjs .github/workflows/er7-integration.yml

      - name: Commit certified ER7 implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ER7 — Real-Device Reader UX & Product Certification"
          git push origin HEAD:er7-real-device-ux
