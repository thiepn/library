name: Public Domain Autopilot

on:
  schedule:
    - cron: '37 3 * * 0'
  push:
    branches: [main]
    paths:
      - '.github/public-domain-autopilot-trigger'
  workflow_dispatch:
    inputs:
      max_books:
        description: Maximum number of new books to ingest
        required: false
        default: '20'
      discovery_pages:
        description: Compatibility input; official Gutenberg Top 100 is authoritative
        required: false
        default: '5'

permissions:
  contents: write

concurrency:
  group: public-domain-autopilot
  cancel-in-progress: true

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_BUCKET: thiepn-library-publications
    steps:
      - name: Checkout Library
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Setup pnpm and Node
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          version: 11.21.0
          runtime: node@22.12.0
          install: false
          cache: true

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Install cover renderer dependency
        run: python3 -m pip install --disable-pip-version-check 'Pillow==11.3.0'

      - name: Verify cover renderer and EPUB embedding
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/public-domain/run-curated.py \
            scripts/public-domain/cover_pipeline.py \
            scripts/public-domain/cover_job.py \
            scripts/public-domain/finalize-cover-release.py \
            scripts/public-domain/verify-cover-pipeline.py
          python3 scripts/public-domain/verify-cover-pipeline.py

      - name: Require cover and publication credentials
        run: |
          set -euo pipefail
          test -n "${OPENAI_API_KEY:-}"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${R2_BUCKET:-}"

      - name: Ensure native EPUB releases are reader-first
        run: python3 scripts/public-domain/prepare-library.py

      - name: Resolve acquisition mode
        id: acquisition
        shell: bash
        run: |
          set -euo pipefail
          curated_ids=''
          mode='official-project-gutenberg-top100-30d'
          if [ "${GITHUB_EVENT_NAME}" = 'push' ] && grep -Fxq 'mode: curated-christian-classics' .github/public-domain-autopilot-trigger; then
            curated_ids="$(sed -n 's/^curated-ids:[[:space:]]*//p' .github/public-domain-autopilot-trigger | head -n 1 | tr -d '[:space:]')"
            test -n "$curated_ids"
            mode='curated-christian-classics'
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "curated_ids=$curated_ids" >> "$GITHUB_OUTPUT"
          echo "ACQUISITION_MODE $mode"

      - name: Discover, verify, and stage public-domain books
        id: discover
        env:
          MAX_BOOKS: ${{ github.event.inputs.max_books || '20' }}
          DISCOVERY_PAGES: ${{ github.event.inputs.discovery_pages || '5' }}
          MAX_CANDIDATE_CHECKS: '100'
          CURATED_IDS: ${{ steps.acquisition.outputs.curated_ids }}
        run: |
          set -euo pipefail
          if [ -n "${CURATED_IDS:-}" ]; then
            timeout 20m python3 scripts/public-domain/run-curated.py \
              --ids "$CURATED_IDS" \
              --max-books "$MAX_BOOKS" \
              --max-candidate-checks "$MAX_CANDIDATE_CHECKS"
          else
            timeout 12m python3 scripts/public-domain/run.py \
              --max-books "$MAX_BOOKS" \
              --discovery-pages "$DISCOVERY_PAGES" \
              --max-candidate-checks "$MAX_CANDIDATE_CHECKS"
          fi

      - name: Generate book-specific covers and embed them into staged EPUBs
        if: steps.discover.outputs.added_count != '0'
        id: covers
        run: python3 scripts/public-domain/cover_job.py --new-staging

      - name: Give cover-enhanced releases content-addressed immutable keys
        if: steps.discover.outputs.added_count != '0'
        run: python3 scripts/public-domain/finalize-cover-release.py --mode new

      - name: Certify complete Library before upload
        if: steps.discover.outputs.added_count != '0'
        run: pnpm release:certify

      - name: Upload immutable EPUBs to R2 and verify readback
        if: steps.discover.outputs.added_count != '0'
        run: |
          set -euo pipefail
          mkdir -p /tmp/public-domain-readback
          python3 - <<'PY' > /tmp/public-domain-artifacts.tsv
          import json
          from pathlib import Path
          items = json.loads(Path('.public-domain-staging/artifacts.json').read_text())
          for item in items:
              print('\t'.join([
                  item['localPath'],
                  item['r2Key'],
                  str(item['sizeBytes']),
                  item['sha256'],
              ]))
          PY

          while IFS=$'\t' read -r local_path key bytes hash; do
            test -f "$local_path"
            filename="$(basename "$local_path")"
            readback="/tmp/public-domain-readback/$filename"
            pnpm exec wrangler r2 object put "$R2_BUCKET/$key" --file="$local_path" --remote
            pnpm exec wrangler r2 object get "$R2_BUCKET/$key" --file="$readback" --remote
            test "$(stat -c %s "$readback")" = "$bytes"
            printf '%s  %s\n' "$hash" "$readback" | sha256sum -c -
            echo "R2_VERIFIED $key"
          done < /tmp/public-domain-artifacts.tsv

      - name: Commit verified metadata and provenance to promotion branch
        if: steps.discover.outputs.added_count != '0'
        id: promote
        run: |
          set -euo pipefail
          rm -rf .public-domain-staging
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          branch="autopilot/public-domain-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git add \
            src/content/works \
            src/publications/releases \
            src/publications/public-domain-ledger.json \
            public/covers/public-domain \
            'src/pages/works/[slug].astro' \
            scripts/certification/work-detail.mjs

          if git diff --cached --quiet; then
            echo "No persistent changes after certification."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "Autopilot: add public-domain Library books"
          git push origin "HEAD:$branch"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "PROMOTION_READY $branch"
          {
            echo "### Public-domain promotion ready"
            echo
            echo "- Branch: \`$branch\`"
            echo "- Works: \`${{ steps.discover.outputs.work_ids }}\`"
            echo "- Selection mode: \`${{ steps.discover.outputs.ranking_mode }}\`"
            echo "- Rights screening: passed"
            echo "- Illustrated covers: generated and embedded"
            echo "- Cover release keys: content-addressed"
            echo "- Complete Library certification: passed"
            echo "- R2 immutable upload/readback: passed"
            echo "- Promotion is handed to the authorized Library Autopilot Supervisor."
          } >> "$GITHUB_STEP_SUMMARY"
