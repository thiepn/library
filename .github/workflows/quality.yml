name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm and Node
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          version: 11.21.0
          runtime: node@22.12.0
          install: false
          cache: true
      - name: Require frozen lockfile
        run: test -f pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Source certification
        run: pnpm certify:source
      - name: Certify curated public-domain ingestion runner
        run: |
          python3 -m py_compile scripts/public-domain/run-curated.py
          python3 scripts/public-domain/run-curated.py --help >/dev/null
      - name: Reader behavioral regression suite
        run: pnpm test:reader
      - name: Validate and build launch shell
        run: pnpm build
      - name: Post-build regression certification
        run: pnpm certify:postbuild && pnpm test:reader:postbuild

  # Dependency-free guest-isolation qualification; original full Quality remains required.
  guest-account-isolation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout exact source HEAD
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Setup Node without dependencies
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          version: 11.21.0
          runtime: node@22.12.0
          install: false
          cache: false
      - name: Verify guest-first boundaries
        run: node --experimental-strip-types --test scripts/regression/account-hotfix-no-deps.test.mjs

  # Run actual guest navigation with a configured public Account client.
  # Blocking Account-origin requests must not trap Library navigation.
  guest-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      PUBLIC_THIEPN_ACCOUNT_PUBLISHABLE_KEY: sb_publishable_1rZzRPzfLMaAH5pIgCwIjA_19UPMIsR
    steps:
      - name: Checkout exact source HEAD
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Setup Node and pinned dependencies
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          version: 11.21.0
          runtime: node@22.12.0
          install: false
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium firefox
      - name: Verify guest and failed-callback browser behavior
        run: pnpm exec playwright test tests/e2e/account-guest-first.spec.ts --project=chromium-desktop --project=firefox-desktop
