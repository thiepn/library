name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Setup pnpm and Node
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          version: 11.21.0
          runtime: node@22.12.0
          install: false
          cache: true
      - name: Require frozen lockfile
        run: test -f pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Source certification
        run: pnpm certify:source
      - name: Reader behavioral regression suite
        run: pnpm test:reader
      - name: Validate and build launch shell
        run: pnpm build
      - name: Post-build regression certification
        run: pnpm certify:postbuild && pnpm test:reader:postbuild
