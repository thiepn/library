name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - run: corepack enable
      - run: corepack prepare pnpm@11.21.0 --activate
      - name: Require frozen lockfile
        run: test -f pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm certify:source
      - run: pnpm build
