name: Offline Reliability

on:
  push:
    branches: [main, 'release/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-reliability:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm and Node
        uses: pnpm/setup@v2
        with:
          version: 11.21.0
          runtime: node@22.12.0
          install: false
          cache: true

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Certify RR5 source ownership and failure boundaries
        run: pnpm certify:offline-reliability

      - name: Install browser engines and system dependencies
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Build static Library
        run: pnpm build

      - name: Run cross-engine offline, PWA, update, and storage reliability
        run: pnpm test:offline

      - name: Upload failed offline evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-offline-report-${{ github.run_id }}
          path: |
            playwright-offline-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
