name: Browser Acceptance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup pnpm and Node
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          version: 11.21.0
          runtime: node@22.12.0
          install: false
          cache: true

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browser engines and system dependencies
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Build static Library
        run: pnpm build

      - name: Run browser acceptance matrix
        run: pnpm test:e2e

      - name: Upload failed browser evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-acceptance-failure-${{ github.run_id }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
