name: Browser Acceptance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup pnpm and Node
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          version: 11.21.0
          runtime: node@22.12.0
          install: false
          cache: true

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browser engines and system dependencies
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Build static Library
        run: pnpm build

      - name: Run deterministic historical IndexedDB migration acceptance in clean browser contexts
        run: pnpm exec playwright test tests/e2e/historical-storage-migration.spec.ts

      - name: Run publication compatibility in a clean browser process
        run: pnpm exec playwright test tests/e2e/publication-compatibility.spec.ts

      - name: Run remaining browser acceptance matrix
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t specs < <(
            find tests/e2e -type f -name '*.spec.ts' \
              ! -name 'publication-compatibility.spec.ts' \
              ! -name 'historical-storage-migration.spec.ts' \
              -print | sort
          )
          test "${#specs[@]}" -gt 0
          pnpm test:e2e "${specs[@]}" \
            --grep-invert "historical main v8 and personal v2 records upgrade into versioned portable state"

      - name: Upload failed browser evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-acceptance-failure-${{ github.run_id }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
