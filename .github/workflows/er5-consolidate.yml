name: ER5 continuity ownership cleanup

on:
  push:
    branches: [er5-unified-reader-entry]
    paths:
      - .github/workflows/er5-consolidate.yml

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: er5-unified-reader-entry
          fetch-depth: 0
      - name: Remove duplicate legacy entry ownership
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          index = Path('src/pages/index.astro')
          text = index.read_text()
          text, n = re.subn(
              r"    async function renderCards\(\) \{.*?\n    \}\n\n    async function renderContinue\(\) \{.*?\n    \}\n\n    root\?\.addEventListener",
              """    async function renderCards() {
              const favorites = new Set(await getFavoriteWorkIds().catch(() => []));
              for (const card of cards) {
                const workId = card.dataset.catalogWork;
                if (!workId) continue;
                const saved = favorites.has(workId);
                card.dataset.saved = String(saved);
                const badge = card.querySelector<HTMLElement>('[data-saved-badge]');
                if (badge) badge.hidden = !saved;
                const saveButton = card.querySelector<HTMLButtonElement>('[data-save-work]');
                if (saveButton) {
                  saveButton.textContent = saved ? 'In My Library' : 'Add to My Library';
                  saveButton.setAttribute('aria-pressed', String(saved));
                }
              }
            }

            root?.addEventListener""",
              text,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit(f'index ownership replacement count: {n}')
          text = text.replace(
              "      await Promise.all([renderCards(), renderContinue()]);",
              "      await renderCards();",
          )
          index.write_text(text)

          detail = Path('src/pages/works/[slug].astro')
          text = detail.read_text()
          text, n = re.subn(
              r"    async function renderReadingState\(\) \{.*?\n    \}\n\n    control\?\.addEventListener",
              """    control?.addEventListener""",
              text,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit(f'detail ownership replacement count: {n}')
          text = text.replace("    void renderReadingState();\n", "")
          detail.write_text(text)

          saved = Path('src/pages/saved.astro')
          text = saved.read_text().replace(
              "      open.textContent = book.format === 'epub' ? 'Read' : 'Open PDF';",
              "      open.textContent = 'Read';",
          )
          saved.write_text(text)

          dom = Path('src/lib/reader-entry/dom.ts')
          text = dom.read_text()
          text = text.replace(
              "  return { workId, edition, releaseVersion, epubHref, webHref, pdfHref };",
              "  return { workId, edition, releaseVersion, ...(epubHref ? { epubHref } : {}), ...(webHref ? { webHref } : {}), ...(pdfHref ? { pdfHref } : {}) };",
          )
          if text.count("return { workId, edition, releaseVersion, ...(epubHref ? { epubHref } : {})") != 2:
              raise SystemExit('expected both continuity request builders to become exact-optional safe')
          dom.write_text(text)
          PY
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/index.astro 'src/pages/works/[slug].astro' src/pages/saved.astro src/lib/reader-entry/dom.ts
          git diff --cached --quiet && exit 0
          git commit -m "ER5 centralize continuity entry ownership"
          git pull --rebase origin er5-unified-reader-entry
          git push origin HEAD:er5-unified-reader-entry
