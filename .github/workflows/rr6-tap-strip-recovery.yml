name: RR6 tap-strip recovery

on:
  push:
    branches:
      - fix/rr6-staged-tap-strip-fallback
    paths:
      - .github/workflows/rr6-tap-strip-recovery.yml

permissions:
  contents: write

concurrency:
  group: rr6-tap-strip-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Setup pnpm and Node
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          version: 11.21.0
          runtime: node@22.12.0
          install: false
          cache: true
      - name: Patch exact-page-strip touch fallback
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          path = Path('src/lib/reader/engines/epubjs.ts')
          text = path.read_text()
          old = base64.b64decode('').decode()
          new = base64.b64decode('').decode()
          if old not in text:
              raise SystemExit('expected RR6 fallback block not found; refusing to patch')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
      - name: Install and certify source
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm check
          pnpm test:reader
      - name: Commit repair and self-remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/rr6-tap-strip-recovery.yml
          git add src/lib/reader/engines/epubjs.ts
          git commit -m 'fix: wrap exact EPUB page-strip tap coordinates'
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
