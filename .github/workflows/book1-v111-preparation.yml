name: Book 1 v1.1.1 isolated preparation
on:
  pull_request:
    paths:
      - '.github/workflows/book1-v111-preparation.yml'
      - 'src/publications/candidates/how-to-love-god/1.1.1/**'
      - 'scripts/certification/book1-v111-*.mjs'
      - 'scripts/certification/how-to-love-god-print-epub.mjs'
      - 'src/content/works/how-to-love-god/chapters/00-copyright.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    env:
      BOOK1_111_PREP: '1'
      BOOK1_MEDIA_PROOF: '1'
      BOOK1_CANDIDATE_VERSION: '1.1.1'
      BOOK1_111_FINAL_CANDIDATE: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.12.0'
      - name: Syntax and immutable-release preflight
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/certification/how-to-love-god-print-epub.mjs
          node --check scripts/certification/book1-v111-stage.mjs
          node --check scripts/certification/book1-v111-verify.mjs
          python3 -m py_compile scripts/certification/book1-v111-pdfua.py
          grep -q '^  activeRelease: 1.1.0$' src/content/works/how-to-love-god/work.yaml
          test ! -e src/publications/releases/how-to-love-god/1.1.1.yaml
      - name: Install isolated public-only build dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/book1-111-tools"
          printf '{"private":true,"type":"module"}\n' > "$RUNNER_TEMP/book1-111-tools/package.json"
          npm install --prefix "$RUNNER_TEMP/book1-111-tools" --ignore-scripts --no-package-lock --no-audit --no-fund --no-save @astrojs/markdown-remark@7.3.0 @playwright/test@1.62.1 jszip@3.10.1 @xmldom/xmldom@0.9.12 pdfjs-dist@5.4.530
          ln -s "$RUNNER_TEMP/book1-111-tools/node_modules" ./node_modules
          "$RUNNER_TEMP/book1-111-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Independently verify old cover and original 1.1.0 assets
        run: node scripts/certification/how-to-love-god-media.mjs
      - name: Stage six source-verified SVGs without altering old release
        run: node scripts/certification/book1-v111-stage.mjs
      - name: Render 1.1.1 unpublished EPUB and tagged A5 PDF
        run: node scripts/certification/how-to-love-god-print-epub.mjs
      - name: Verify actual media binaries, creator and descriptions in EPUB/PDF
        run: node scripts/certification/book1-v111-verify.mjs
      - name: Official EPUBCheck v5.4.0 against new EPUB
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 https://github.com/w3c/epubcheck/releases/download/v5.4.0/epubcheck-5.4.0.zip -o "$RUNNER_TEMP/book1-epubcheck.zip"
          unzip -q "$RUNNER_TEMP/book1-epubcheck.zip" -d "$RUNNER_TEMP/epubcheck"
          java -jar "$RUNNER_TEMP/epubcheck/epubcheck-5.4.0/epubcheck.jar" "$RUNNER_TEMP/book1-format-qa/how-to-love-god-UNPUBLISHED-QA.epub" --json "$RUNNER_TEMP/book1-format-qa/epubcheck-111.json"

      - name: Install isolated PDF verification tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq poppler-utils
          python3 -m venv "$RUNNER_TEMP/book1-111-python"
          "$RUNNER_TEMP/book1-111-python/bin/python" -m pip install --disable-pip-version-check --no-cache-dir pikepdf==9.11.0 PyMuPDF==1.26.3
          docker pull verapdf/cli:v1.30.2
          docker image inspect verapdf/cli:v1.30.2 --format '{{index .RepoDigests 0}}' > "$RUNNER_TEMP/book1-format-qa/verapdf-image-111.txt"
          grep -q 'sha256:d5ee329657cf9bc4b2400392dd54c7d0a0ce9980ff6fa2da5590eebeec007cdb' "$RUNNER_TEMP/book1-format-qa/verapdf-image-111.txt"
      - name: Repair exact known PDF structure without changing source
        run: |\n          "$RUNNER_TEMP/book1-111-python/bin/python" scripts/certification/book1-v111-pdfua.py
      - name: Independently inspect intermediate PDF/UA
        shell: bash
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/book1-format-qa"
          set +e
          docker run --rm --network none --user "$(id -u):$(id -g)" -v "$base:/data:ro" verapdf/cli:v1.30.2 --format json --flavour ua1 --maxfailuresdisplayed 500 /data/how-to-love-god-PDFUA-REMEDIATED-QA.pdf > "$base/pdfua-repaired-raw.json"
          code="$?"
          set -e
          test -s "$base/pdfua-repaired-raw.json"
          echo "INTERMEDIATE_VERAPDF_EXIT_CODE=$code"
      - name: Repair only genuine validator-identified list defects
        run: |\n          "$RUNNER_TEMP/book1-111-python/bin/python" scripts/certification/book1-v111-pdfua.py --fix-lists
      - name: Independently qualify exact final PDF/UA-1 bytes
        shell: bash
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/book1-format-qa"
          docker run --rm --network none --user "$(id -u):$(id -g)" -v "$base:/data:ro" verapdf/cli:v1.30.2 --format json --flavour ua1 --maxfailuresdisplayed 200 /data/how-to-love-god-PDFUA-FINAL-QA.pdf > "$base/pdfua-final-111.json"
          test -s "$base/pdfua-final-111.json"
      - name: Verify corrected byline in PDF Info and XMP
        shell: bash
        run: |
          "$RUNNER_TEMP/book1-111-python/bin/python" - <<'PY'
          import os, pathlib, pikepdf
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'book1-format-qa/how-to-love-god-PDFUA-FINAL-QA.pdf'
          with pikepdf.open(p) as f:
              assert str(f.docinfo['/Title'])=='How to Love God'
              assert str(f.docinfo['/Author'])=='Thiepn'
              with f.open_metadata() as m:
                  assert m['dc:creator']==['Thiepn']
                  assert m['dc:rights']=='Copyright © 2026 Thiepn. All rights reserved.'
              print('BOOK1_111_PDF_TITLE_CREATOR_RIGHTS_PASS',len(f.pages))
          PY
      - name: Upload unpublished exact candidate and validator evidence for private review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: book1-111-nonpublishing-evidence-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/book1-format-qa/new-version-staging.json
            ${{ runner.temp }}/book1-format-qa/book1-111-audit.json
            ${{ runner.temp }}/book1-format-qa/epubcheck-111.json
            ${{ runner.temp }}/book1-format-qa/pdfua-final-111.json
            ${{ runner.temp }}/book1-format-qa/pdfua-repaired-raw.json
            ${{ runner.temp }}/book1-format-qa/verapdf-image-111.txt
            ${{ runner.temp }}/book1-format-qa/how-to-love-god-UNPUBLISHED-QA.epub
            ${{ runner.temp }}/book1-format-qa/how-to-love-god-PDFUA-FINAL-QA.pdf
            ${{ runner.temp }}/book1-format-qa/media/how-to-love-god.webp
          if-no-files-found: warn
