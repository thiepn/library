name: Deploy Library

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: library-production
  cancel-in-progress: true

jobs:
  readiness:
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Record production deployment outcome')
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
      blockers: ${{ steps.gate.outputs.blockers }}
    steps:
      - uses: actions/checkout@v5
      - id: gate
        shell: bash
        run: |
          set -euo pipefail
          blockers=()
          test -f pnpm-lock.yaml || blockers+=("pnpm-lockfile")
          test -n "${CLOUDFLARE_API_TOKEN:-}" || blockers+=("cloudflare-api-token")
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || blockers+=("cloudflare-account-id")

          if test ${#blockers[@]} -eq 0; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            echo 'blockers=' >> "$GITHUB_OUTPUT"
            echo 'Production gate satisfied.'
          else
            joined=$(IFS=,; echo "${blockers[*]}")
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo "blockers=$joined" >> "$GITHUB_OUTPUT"
            echo "::notice title=Library production gate blocked::$joined"
          fi

  build:
    needs: readiness
    if: needs.readiness.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      browser: ${{ steps.browser.outcome }}
      performance: ${{ steps.performance.outcome }}
      offline: ${{ steps.offline.outcome }}
      accessibility: ${{ steps.accessibility.outcome }}
      ergonomics: ${{ steps.ergonomics.outcome }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_BUCKET: thiepn-library-publications
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm and Node
        uses: pnpm/setup@v2
        with:
          version: 11.21.0
          runtime: node@22.12.0
          install: false
          cache: true

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Certify release and build static site
        run: pnpm release:certify

      - name: Stage every immutable publication artifact from R2
        run: pnpm stage:media

      - name: Install browser engines and system dependencies
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Run browser acceptance against the staged production artifact
        id: browser
        run: pnpm test:e2e

      - name: Upload failed production browser evidence
        if: failure() && steps.browser.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: production-browser-acceptance-${{ github.run_id }}
          path: |
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 14

      - name: Run RR4 performance and memory budgets
        id: performance
        run: pnpm test:performance

      - name: Upload failed production performance evidence
        if: failure() && steps.performance.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: production-performance-budget-${{ github.run_id }}
          path: |
            playwright-performance-report
            test-results
          if-no-files-found: warn
          retention-days: 14

      - name: Run RR5 offline, PWA, update, and storage reliability
        id: offline
        run: pnpm test:offline

      - name: Upload failed production offline evidence
        if: failure() && steps.offline.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: production-offline-reliability-${{ github.run_id }}
          path: |
            playwright-offline-report
            test-results
          if-no-files-found: warn
          retention-days: 14

      - name: Run RR6 accessibility and inclusive-reading acceptance
        id: accessibility
        env:
          RR6_STAGED_HOSTED_MEDIA: '1'
        run: pnpm test:accessibility

      - name: Upload failed production accessibility evidence
        if: failure() && steps.accessibility.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: production-accessibility-acceptance-${{ github.run_id }}
          path: |
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 14

      - name: Run RR7 reading ergonomics and product UX acceptance
        id: ergonomics
        env:
          RR6_STAGED_HOSTED_MEDIA: '1'
        run: pnpm test:ergonomics

      - name: Upload failed production ergonomics evidence
        if: failure() && steps.ergonomics.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: production-reading-ergonomics-${{ github.run_id }}
          path: |
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 14

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload certified Library artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist/library

  deploy:
    needs: build
    if: needs.build.result == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-production:
    needs: deploy
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm and Node
        uses: pnpm/setup@v2
        with:
          version: 11.21.0
          runtime: node@22.12.0
          install: false
          cache: true

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Wait for custom-domain propagation
        run: sleep 10

      - name: Verify every live work and canonical artifact
        run: pnpm verify:production

  report:
    needs: [readiness, build, deploy, verify-production]
    if: always() && (github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Record production deployment outcome'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Record production deployment outcome
        env:
          READINESS_RESULT: ${{ needs.readiness.result }}
          READY: ${{ needs.readiness.outputs.ready }}
          BLOCKERS: ${{ needs.readiness.outputs.blockers }}
          BUILD_RESULT: ${{ needs.build.result }}
          BROWSER_RESULT: ${{ needs.build.outputs.browser }}
          PERFORMANCE_RESULT: ${{ needs.build.outputs.performance }}
          OFFLINE_RESULT: ${{ needs.build.outputs.offline }}
          ACCESSIBILITY_RESULT: ${{ needs.build.outputs.accessibility }}
          ERGONOMICS_RESULT: ${{ needs.build.outputs.ergonomics }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          VERIFY_RESULT: ${{ needs.verify-production.result }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git checkout -B deploy-status origin/main
          mkdir -p docs
          cat > docs/PRODUCTION_DEPLOY_STATUS.md <<EOF
          # Library production deployment status

          Run: ${GITHUB_RUN_ID}
          Source SHA: ${GITHUB_SHA}

          | Stage | Outcome |
          | --- | --- |
          | readiness job | ${READINESS_RESULT} |
          | production gate | ${READY:-false} |
          | blockers | ${BLOCKERS:-none} |
          | certified build + R2 media staging | ${BUILD_RESULT} |
          | browser acceptance before artifact upload | ${BROWSER_RESULT:-not-run} |
          | RR4 performance/memory budgets before artifact upload | ${PERFORMANCE_RESULT:-not-run} |
          | RR5 offline/PWA/storage reliability before artifact upload | ${OFFLINE_RESULT:-not-run} |
          | RR6 accessibility/inclusive-reading acceptance before artifact upload | ${ACCESSIBILITY_RESULT:-not-run} |
          | RR7 reading ergonomics/product UX acceptance before artifact upload | ${ERGONOMICS_RESULT:-not-run} |
          | GitHub Pages deployment | ${DEPLOY_RESULT} |
          | live application + media verification | ${VERIFY_RESULT} |
          EOF
          git add docs/PRODUCTION_DEPLOY_STATUS.md
          git diff --cached --quiet && exit 0
          git commit -m 'Record production deployment outcome'
          git push origin HEAD:main
