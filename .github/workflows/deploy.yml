name: Deploy Library

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: library-production
  cancel-in-progress: true

jobs:
  readiness:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
      blockers: ${{ steps.gate.outputs.blockers }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - id: gate
        shell: bash
        run: |
          set -euo pipefail
          blockers=()
          test -f pnpm-lock.yaml || blockers+=("pnpm-lockfile")
          test -n "${CLOUDFLARE_API_TOKEN:-}" || blockers+=("cloudflare-api-token")
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || blockers+=("cloudflare-account-id")

          if test ${#blockers[@]} -eq 0; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            echo 'blockers=' >> "$GITHUB_OUTPUT"
            echo 'Production gate satisfied.'
          else
            joined=$(IFS=,; echo "${blockers[*]}")
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo "blockers=$joined" >> "$GITHUB_OUTPUT"
            echo "::notice title=Library production gate blocked::$joined"
          fi

  build:
    needs: readiness
    if: needs.readiness.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 105
    outputs:
      browser: ${{ steps.browser.outcome }}
      performance: ${{ steps.performance.outcome }}
      offline: ${{ steps.offline.outcome }}
      accessibility: ${{ steps.accessibility.outcome }}
      ergonomics: ${{ steps.ergonomics.outcome }}
      durability: ${{ steps.durability.outcome }}
      security: ${{ steps.security.outcome }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_BUCKET: thiepn-library-publications
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup pnpm and Node
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          version: 11.21.0
          runtime: node@22.12.0
          install: false
          cache: true

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Certify release and build static site
        run: pnpm release:certify

      - name: Stage every immutable publication artifact from R2
        run: pnpm stage:media

      - name: Install browser engines and system dependencies
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Run browser acceptance against the staged production artifact
        id: browser
        run: pnpm test:e2e

      - name: Upload failed production browser evidence
        if: failure() && steps.browser.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-browser-acceptance-${{ github.run_id }}
          path: |
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 14

      - name: Run RR4 performance and memory budgets
        id: performance
        run: pnpm test:performance

      - name: Upload failed production performance evidence
        if: failure() && steps.performance.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-performance-budget-${{ github.run_id }}
          path: |
            playwright-performance-report
            test-results
          if-no-files-found: warn
          retention-days: 14

      - name: Run RR5 offline, PWA, update, and storage reliability
        id: offline
        run: pnpm test:offline

      - name: Upload failed production offline evidence
        if: failure() && steps.offline.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-offline-reliability-${{ github.run_id }}
          path: |
            playwright-offline-report
            test-results
          if-no-files-found: warn
          retention-days: 14

      - name: Run RR6 accessibility and inclusive-reading acceptance
        id: accessibility
        env:
          RR6_STAGED_HOSTED_MEDIA: '1'
        run: pnpm test:accessibility

      - name: Upload failed production accessibility evidence
        if: failure() && steps.accessibility.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-accessibility-acceptance-${{ github.run_id }}
          path: |
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 14

      - name: Run RR7 reading ergonomics and product UX acceptance
        id: ergonomics
        env:
          RR6_STAGED_HOSTED_MEDIA: '1'
        run: pnpm test:ergonomics

      - name: Upload failed production ergonomics evidence
        if: failure() && steps.ergonomics.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-reading-ergonomics-${{ github.run_id }}
          path: |
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 14

      - name: Run RR8 data durability, migration, backup, and portability acceptance
        id: durability
        run: pnpm test:durability

      - name: Upload failed production durability evidence
        if: failure() && steps.durability.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-data-durability-${{ github.run_id }}
          path: |
            playwright-report
            playwright-offline-report
            test-results
          if-no-files-found: warn
          retention-days: 14

      - name: Run RR9 security, privacy, dependency, and provenance acceptance
        id: security
        run: |
          pnpm certify:security
          pnpm security:audit
          pnpm security:licenses
          pnpm security:sbom
          pnpm test:security

      - name: Upload failed production security evidence
        if: failure() && steps.security.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-security-hardening-${{ github.run_id }}
          path: |
            .build/security
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 30

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true

      - name: Upload certified Library artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ./dist/library

  deploy:
    needs: build
    if: needs.build.result == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  verify-production:
    needs: deploy
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup pnpm and Node
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          version: 11.21.0
          runtime: node@22.12.0
          install: false
          cache: true

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Wait for custom-domain propagation
        run: sleep 10

      - name: Verify every live work, policy, source identity, and canonical artifact
        env:
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
        run: pnpm verify:production

  report:
    needs: [readiness, build, deploy, verify-production]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write immutable production deployment evidence
        env:
          READINESS_RESULT: ${{ needs.readiness.result }}
          READY: ${{ needs.readiness.outputs.ready }}
          BLOCKERS: ${{ needs.readiness.outputs.blockers }}
          BUILD_RESULT: ${{ needs.build.result }}
          BROWSER_RESULT: ${{ needs.build.outputs.browser }}
          PERFORMANCE_RESULT: ${{ needs.build.outputs.performance }}
          OFFLINE_RESULT: ${{ needs.build.outputs.offline }}
          ACCESSIBILITY_RESULT: ${{ needs.build.outputs.accessibility }}
          ERGONOMICS_RESULT: ${{ needs.build.outputs.ergonomics }}
          DURABILITY_RESULT: ${{ needs.build.outputs.durability }}
          SECURITY_RESULT: ${{ needs.build.outputs.security }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          VERIFY_RESULT: ${{ needs.verify-production.result }}
        run: |
          set -euo pipefail
          mkdir -p .build/deployment
          cat > .build/deployment/production-status.md <<EOF
          # Library production deployment status

          Run: ${GITHUB_RUN_ID}
          Source SHA: ${GITHUB_SHA}

          | Stage | Outcome |
          | --- | --- |
          | readiness job | ${READINESS_RESULT} |
          | production gate | ${READY:-false} |
          | blockers | ${BLOCKERS:-none} |
          | certified build + R2 media staging | ${BUILD_RESULT} |
          | browser acceptance before artifact upload | ${BROWSER_RESULT:-not-run} |
          | RR4 performance/memory budgets before artifact upload | ${PERFORMANCE_RESULT:-not-run} |
          | RR5 offline/PWA/storage reliability before artifact upload | ${OFFLINE_RESULT:-not-run} |
          | RR6 accessibility/inclusive-reading acceptance before artifact upload | ${ACCESSIBILITY_RESULT:-not-run} |
          | RR7 reading ergonomics/product UX acceptance before artifact upload | ${ERGONOMICS_RESULT:-not-run} |
          | RR8 data durability/migration/backup/portability acceptance before artifact upload | ${DURABILITY_RESULT:-not-run} |
          | RR9 security/privacy/dependency acceptance before artifact upload | ${SECURITY_RESULT:-not-run} |
          | GitHub Pages deployment | ${DEPLOY_RESULT} |
          | live application + media verification | ${VERIFY_RESULT} |
          EOF
          node -e "const fs=require('fs'); fs.writeFileSync('.build/deployment/production-status.json', JSON.stringify({schemaVersion:1,runId:process.env.GITHUB_RUN_ID,sourceSha:process.env.GITHUB_SHA,readiness:process.env.READINESS_RESULT,ready:process.env.READY==='true',blockers:process.env.BLOCKERS||'',build:process.env.BUILD_RESULT,browser:process.env.BROWSER_RESULT,performance:process.env.PERFORMANCE_RESULT,offline:process.env.OFFLINE_RESULT,accessibility:process.env.ACCESSIBILITY_RESULT,ergonomics:process.env.ERGONOMICS_RESULT,durability:process.env.DURABILITY_RESULT,security:process.env.SECURITY_RESULT,deploy:process.env.DEPLOY_RESULT,verify:process.env.VERIFY_RESULT}, null, 2)+'\\n')"

      - name: Upload production deployment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-deployment-${{ github.run_id }}
          path: |
            .build/deployment
          if-no-files-found: error
          retention-days: 90
