name: Deploy Library

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: library-production
  cancel-in-progress: true

jobs:
  readiness:
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Record production deployment outcome')
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
      blockers: ${{ steps.gate.outputs.blockers }}
    steps:
      - uses: actions/checkout@v4
      - id: gate
        shell: bash
        run: |
          set -euo pipefail
          count=0
          if test -d src/content/works/ai-for-the-kingdom/chapters; then
            count=$(find src/content/works/ai-for-the-kingdom/chapters -maxdepth 1 -type f \( -name '*.md' -o -name '*.mdx' \) | wc -l | tr -d ' ')
          fi

          blockers=()
          test "$count" = '57' || blockers+=("reader-payload:${count}/57")
          test -f src/publications/releases/ai-for-the-kingdom/1.0.0-rc4.yaml || blockers+=("release-registry")
          test -f pnpm-lock.yaml || blockers+=("pnpm-lockfile")
          test -n "${CLOUDFLARE_API_TOKEN:-}" || blockers+=("cloudflare-api-token")
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || blockers+=("cloudflare-account-id")

          if test ${#blockers[@]} -eq 0; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            echo 'blockers=' >> "$GITHUB_OUTPUT"
            echo 'Production gate satisfied.'
          else
            joined=$(IFS=,; echo "${blockers[*]}")
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo "blockers=$joined" >> "$GITHUB_OUTPUT"
            echo "::notice title=Library production gate blocked::$joined"
          fi

  deploy:
    needs: readiness
    if: needs.readiness.outputs.ready == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm and Node
        uses: pnpm/setup@v2
        with:
          version: 11.21.0
          runtime: node@22.12.0
          install: false
          cache: true
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Certify release
        run: pnpm release:certify
      - name: Deploy certified static assets
        run: pnpm exec wrangler deploy
      - name: Production application smoke test
        run: |
          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 https://thiepn.dev/library >/dev/null
          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 https://thiepn.dev/library/search >/dev/null
          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 https://thiepn.dev/library/subjects >/dev/null
          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 https://thiepn.dev/library/collections >/dev/null
          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 https://thiepn.dev/library/works/ai-for-the-kingdom >/dev/null
          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 https://thiepn.dev/library/works/ai-for-the-kingdom/read >/dev/null
      - name: Production publication media smoke test
        run: |
          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 --range 0-0 https://media.library.thiepn.dev/works/ai-for-the-kingdom/editions/1.0.0-rc4/AI_for_the_Kingdom_ONLINE_EDITION.pdf >/dev/null
          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 --range 0-0 https://media.library.thiepn.dev/works/ai-for-the-kingdom/editions/1.0.0-rc4/AI_for_the_Kingdom.epub >/dev/null
          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 --range 0-0 https://media.library.thiepn.dev/works/ai-for-the-kingdom/editions/1.0.0-rc4/ai-for-the-kingdom.webp >/dev/null

  report:
    needs: [readiness, deploy]
    if: always() && (github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Record production deployment outcome'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record production deployment outcome
        env:
          READINESS_RESULT: ${{ needs.readiness.result }}
          READY: ${{ needs.readiness.outputs.ready }}
          BLOCKERS: ${{ needs.readiness.outputs.blockers }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git checkout -B deploy-status origin/main
          mkdir -p docs
          cat > docs/PRODUCTION_DEPLOY_STATUS.md <<EOF
          # Library production deployment status

          Run: ${GITHUB_RUN_ID}
          Source SHA: ${GITHUB_SHA}

          | Stage | Outcome |
          | --- | --- |
          | readiness job | ${READINESS_RESULT} |
          | production gate | ${READY:-false} |
          | blockers | ${BLOCKERS:-none} |
          | deploy + application/media smoke tests | ${DEPLOY_RESULT} |
          EOF
          git add docs/PRODUCTION_DEPLOY_STATUS.md
          git diff --cached --quiet && exit 0
          git commit -m 'Record production deployment outcome'
          git push origin HEAD:main
