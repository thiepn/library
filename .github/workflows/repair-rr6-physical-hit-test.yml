name: Repair staged RR6 physical hit testing

on:
  push:
    branches:
      - 'autopilot/deploy-recovery-35245459667-rr6-rects'
    paths:
      - '.github/workflows/repair-rr6-physical-hit-test.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Strengthen publication interactive hit testing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/e2e/reader-tap-zones.spec.ts')
          text = path.read_text()
          old = '''        const element = document.elementFromPoint(input.x, input.y) ?? document.documentElement;
          const interactive = Boolean(element.closest(input.interactiveSelector));
          const id = element.id ? `#${element.id}` : '';
          const className = typeof element.className === 'string' && element.className.trim()
            ? `.${element.className.trim().split(/\\s+/).join('.')}`
            : '';
          return {
            interactive,
            description: `${element.tagName.toLowerCase()}${id}${className}`,
          };'''
          new = '''        const element = document.elementFromPoint(input.x, input.y) ?? document.documentElement;
          const directInteractive = element.closest(input.interactiveSelector);
          // Chromium can visually paginate one wide EPUB iframe inside a scrolled/clipped parent.
          // In that geometry elementFromPoint() may report the underlying publication surface even
          // though the physical touchscreen target is an anchor in the visible CSS column. Treat an
          // interactive element whose rendered client rect contains the physical frame coordinate as
          // authoritative too, so the acceptance helper never steals a real publication interaction.
          const rectInteractive = directInteractive ?? Array.from(document.querySelectorAll(input.interactiveSelector)).find((candidate) =>
            Array.from(candidate.getClientRects()).some((rect) =>
              input.x >= rect.left
              && input.x <= rect.right
              && input.y >= rect.top
              && input.y <= rect.bottom,
            ),
          );
          const targetElement = rectInteractive ?? element;
          const interactive = Boolean(rectInteractive);
          const id = targetElement.id ? `#${targetElement.id}` : '';
          const className = typeof targetElement.className === 'string' && targetElement.className.trim()
            ? `.${targetElement.className.trim().split(/\\s+/).join('.')}`
            : '';
          return {
            interactive,
            description: `${targetElement.tagName.toLowerCase()}${id}${className}`,
          };'''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one RR6 hit-test block, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          git diff --check
          grep -F 'const rectInteractive = directInteractive ?? Array.from(document.querySelectorAll(input.interactiveSelector))' tests/e2e/reader-tap-zones.spec.ts

      - name: Commit repair and self-remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/repair-rr6-physical-hit-test.yml
          git add tests/e2e/reader-tap-zones.spec.ts
          git commit -m 'test: preserve publication targets in RR6 tap probes'
          git push origin "HEAD:$GITHUB_REF_NAME"
