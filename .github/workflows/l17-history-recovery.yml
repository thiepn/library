name: L17 Frozen Payload History Recovery

on:
  push:
    branches: [ci/l17-history-recovery]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: l17-history-recovery-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
  cancel-in-progress: false

jobs:
  recover:
    if: github.event_name != 'pull_request' || github.head_ref == 'ci/l17-history-recovery'
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      LEGACY_REF: l17/ai-for-the-kingdom-publication
      PACKAGE: .build/l17-history/AI_for_the_Kingdom_L17_LIBRARY_PUBLICATION_PACKAGE.zip
      MEDIA_DIR: .build/l17b-media
      R2_VERIFY_DIR: .build/l17b-r2-verify
      R2_BUCKET: thiepn-library-publications
      R2_PREFIX: works/ai-for-the-kingdom/editions/1.0.0-rc4
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Setup pnpm and Node
        uses: pnpm/setup@v2
        with:
          version: 11.21.0
          runtime: node@22.12.0
          install: false
          cache: true

      - name: Recover frozen package from all reachable Git history
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build/l17-history
          git fetch --no-tags origin "$LEGACY_REF:refs/remotes/origin/$LEGACY_REF"
          python3 - <<'PY'
          import base64
          import hashlib
          import lzma
          import os
          import re
          import subprocess
          from pathlib import Path

          legacy_ref = os.environ['LEGACY_REF']
          ref = f'refs/remotes/origin/{legacy_ref}'
          package_path = Path(os.environ['PACKAGE'])
          expected_size = 2_034_059
          expected_sha = '1c6f831ca9c3a48031121dc6129d39cb66f5ad521d53c3e9f40153f8c9f776b7'
          xz_magic = bytes.fromhex('fd377a585a00')
          zip_magic = b'PK\x03\x04'
          part_re = re.compile(r'^recovery/l17b/part(\d+)$')
          relevant_tokens = ('l17', 'kingdom', 'publication', 'payload', 'recovery', '.zip', '.xz', '.b64')

          def git(*args):
              return subprocess.check_output(['git', *args])

          def blob(sha):
              return git('cat-file', 'blob', sha)

          def accept_package(data, label, xz_payload=None):
              digest = hashlib.sha256(data).hexdigest()
              print(f'candidate {label}: bytes={len(data)} sha256={digest}')
              if len(data) != expected_size or digest != expected_sha:
                  return False
              package_path.parent.mkdir(parents=True, exist_ok=True)
              package_path.write_bytes(data)
              if xz_payload is not None:
                  Path('.build/l17-history/payload.xz').write_bytes(xz_payload)
              print(f'FROZEN_PACKAGE_RECOVERED source={label}')
              return True

          def try_bytes(data, label):
              if len(data) == expected_size and accept_package(data, f'{label}:raw'):
                  return True
              if data.startswith(xz_magic):
                  try:
                      unpacked = lzma.decompress(data, format=lzma.FORMAT_XZ)
                  except Exception as exc:
                      print(f'{label}: raw XZ incomplete/invalid: {exc}')
                  else:
                      if accept_package(unpacked, f'{label}:xz', data):
                          return True
              encoded = b''.join(data.split())
              if encoded.startswith(b'/Td6WFo') and len(encoded) % 4 != 1:
                  try:
                      padded = encoded + b'=' * ((4 - len(encoded) % 4) % 4)
                      decoded = base64.b64decode(padded, validate=True)
                  except Exception as exc:
                      print(f'{label}: Base64 invalid: {exc}')
                  else:
                      if decoded.startswith(xz_magic):
                          try:
                              unpacked = lzma.decompress(decoded, format=lzma.FORMAT_XZ)
                          except Exception as exc:
                              print(f'{label}: Base64 XZ incomplete/invalid: {exc}')
                          else:
                              if accept_package(unpacked, f'{label}:base64-xz', decoded):
                                  return True
              return False

          commits = git('rev-list', '--reverse', ref).decode().splitlines()
          print(f'legacy commits reachable: {len(commits)}')
          for commit in commits:
              message = git('show', '-s', '--format=%h %s', commit).decode().strip()
              print(f'commit {message}')

          seen_blobs = set()
          relevant = []
          part_versions = {}
          exact_size_blobs = []

          for commit in commits:
              tree = git('ls-tree', '-r', '-l', commit).decode('utf-8', 'replace').splitlines()
              for line in tree:
                  if '\t' not in line:
                      continue
                  left, path = line.split('\t', 1)
                  fields = left.split()
                  if len(fields) < 4 or fields[1] != 'blob':
                      continue
                  sha = fields[2]
                  try:
                      size = int(fields[3])
                  except ValueError:
                      continue
                  if sha in seen_blobs:
                      continue
                  seen_blobs.add(sha)
                  lower = path.lower()
                  if size == expected_size:
                      exact_size_blobs.append((size, sha, path, commit))
                  if any(token in lower for token in relevant_tokens) or size >= 500_000:
                      relevant.append((size, sha, path, commit))
                  match = part_re.match(path)
                  if match:
                      index = int(match.group(1))
                      part_versions.setdefault(index, []).append((size, sha, path, commit))

          print(f'unique reachable blobs: {len(seen_blobs)}')
          print(f'historical recovery part indices: {sorted(part_versions)}')
          for index in sorted(part_versions):
              versions = sorted(part_versions[index], reverse=True)
              print(f'part{index:02d} versions: ' + ', '.join(f'{size}B@{commit[:8]}' for size, _, _, commit in versions))

          print('largest relevant historical blobs:')
          for size, sha, path, commit in sorted(relevant, reverse=True)[:40]:
              print(f'  {size:>9} {sha[:10]} {commit[:8]} {path}')

          # First, test any blob whose byte size already matches the frozen ZIP.
          for _, sha, path, commit in exact_size_blobs:
              if try_bytes(blob(sha), f'exact-size-blob:{commit[:8]}:{path}'):
                  raise SystemExit(0)

          # Then test all plausibly relevant blobs directly as ZIP/XZ/Base64-XZ.
          for size, sha, path, commit in sorted(relevant, reverse=True):
              if size < 1_000:
                  continue
              data = blob(sha)
              if data.startswith(zip_magic) or data.startswith(xz_magic) or b''.join(data[:64].split()).startswith(b'/Td6WFo'):
                  if try_bytes(data, f'blob:{commit[:8]}:{path}'):
                      raise SystemExit(0)

          # Reassemble the largest historical version of every numbered part. This
          # recovers files that may have existed in earlier commits and later been
          # overwritten or deleted. Exact package SHA remains the acceptance gate.
          if part_versions:
              assembled = []
              chosen = []
              for index in sorted(part_versions):
                  size, sha, path, commit = max(part_versions[index], key=lambda item: item[0])
                  normalized = b''.join(blob(sha).split())
                  assembled.append(normalized)
                  chosen.append((index, len(normalized), commit[:8]))
              encoded = b''.join(assembled)
              print(f'largest-version assembly: parts={chosen} encoded_bytes={len(encoded)} mod4={len(encoded) % 4}')
              if len(encoded) % 4 != 1:
                  try:
                      padded = encoded + b'=' * ((4 - len(encoded) % 4) % 4)
                      xz_payload = base64.b64decode(padded, validate=True)
                      unpacked = lzma.decompress(xz_payload, format=lzma.FORMAT_XZ)
                  except Exception as exc:
                      print(f'largest-version assembly invalid/incomplete: {exc}')
                  else:
                      if accept_package(unpacked, 'largest-historical-part-assembly', xz_payload):
                          raise SystemExit(0)

          # Finally, test every actual commit state. This avoids mixing incompatible
          # part generations when the same part path changed across commits.
          best_state = None
          for commit in commits:
              rows = git('ls-tree', '-r', '-l', commit, 'recovery/l17b').decode('utf-8', 'replace').splitlines()
              state_parts = []
              indices = []
              for line in rows:
                  if '\t' not in line:
                      continue
                  left, path = line.split('\t', 1)
                  match = part_re.match(path)
                  if not match:
                      continue
                  fields = left.split()
                  if len(fields) < 4:
                      continue
                  sha = fields[2]
                  index = int(match.group(1))
                  state_parts.append((index, b''.join(blob(sha).split())))
                  indices.append(index)
              state_parts.sort(key=lambda item: item[0])
              encoded = b''.join(data for _, data in state_parts)
              if not best_state or len(encoded) > best_state[0]:
                  best_state = (len(encoded), commit, list(indices))
              if not encoded or len(encoded) % 4 == 1:
                  continue
              try:
                  padded = encoded + b'=' * ((4 - len(encoded) % 4) % 4)
                  xz_payload = base64.b64decode(padded, validate=True)
                  unpacked = lzma.decompress(xz_payload, format=lzma.FORMAT_XZ)
              except Exception:
                  continue
              if accept_package(unpacked, f'commit-state:{commit[:8]}', xz_payload):
                  raise SystemExit(0)

          if best_state:
              print(f'largest commit-state recovery payload: encoded_bytes={best_state[0]} commit={best_state[1][:8]} indices={best_state[2]}')
          print('FROZEN_PACKAGE_NOT_FOUND_IN_REACHABLE_GIT_HISTORY')
          raise SystemExit(42)
          PY
          test "$(stat -c%s "$PACKAGE")" = '2034059'
          echo '1c6f831ca9c3a48031121dc6129d39cb66f5ad521d53c3e9f40153f8c9f776b7  '"$PACKAGE" | sha256sum --check --strict

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Inject and verify exact publication payload
        run: |
          node scripts/l17b-inject-package.mjs "$PACKAGE"
          L17B_PACKAGE="$PACKAGE" L17B_MEDIA_DIR="$MEDIA_DIR" pnpm l17b:verify

      - name: Upload and read back immutable R2 objects when credentials exist
        id: r2
        shell: bash
        run: |
          set -euo pipefail
          if test -z "${CLOUDFLARE_API_TOKEN:-}" || test -z "${CLOUDFLARE_ACCOUNT_ID:-}"; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Cloudflare repository secrets are not configured; verified source recovery will still be committed.'
            exit 0
          fi
          pnpm exec wrangler r2 object put "$R2_BUCKET/$R2_PREFIX/AI_for_the_Kingdom_ONLINE_EDITION.pdf" --file="$MEDIA_DIR/AI_for_the_Kingdom_ONLINE_EDITION.pdf" --content-type='application/pdf' --cache-control='public, max-age=31536000, immutable' --remote
          pnpm exec wrangler r2 object put "$R2_BUCKET/$R2_PREFIX/AI_for_the_Kingdom.epub" --file="$MEDIA_DIR/AI_for_the_Kingdom.epub" --content-type='application/epub+zip' --content-disposition='attachment; filename="AI_for_the_Kingdom.epub"' --cache-control='public, max-age=31536000, immutable' --remote
          pnpm exec wrangler r2 object put "$R2_BUCKET/$R2_PREFIX/ai-for-the-kingdom.webp" --file="$MEDIA_DIR/ai-for-the-kingdom.webp" --content-type='image/webp' --cache-control='public, max-age=31536000, immutable' --remote
          rm -rf "$R2_VERIFY_DIR" && mkdir -p "$R2_VERIFY_DIR"
          pnpm exec wrangler r2 object get "$R2_BUCKET/$R2_PREFIX/AI_for_the_Kingdom_ONLINE_EDITION.pdf" --file="$R2_VERIFY_DIR/AI_for_the_Kingdom_ONLINE_EDITION.pdf" --remote
          pnpm exec wrangler r2 object get "$R2_BUCKET/$R2_PREFIX/AI_for_the_Kingdom.epub" --file="$R2_VERIFY_DIR/AI_for_the_Kingdom.epub" --remote
          pnpm exec wrangler r2 object get "$R2_BUCKET/$R2_PREFIX/ai-for-the-kingdom.webp" --file="$R2_VERIFY_DIR/ai-for-the-kingdom.webp" --remote
          L17B_MEDIA_DIR="$R2_VERIFY_DIR" pnpm l17b:verify
          node scripts/l17b-write-release.mjs
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Commit verified recovered source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/content/works/ai-for-the-kingdom/chapters
          if test -f src/publications/releases/ai-for-the-kingdom/1.0.0-rc4.yaml; then
            git add src/publications/releases/ai-for-the-kingdom/1.0.0-rc4.yaml
          fi
          git diff --cached --quiet && exit 0
          git commit -m 'Recover verified frozen AI for the Kingdom payload from Git history'
          git pull --rebase origin "$TARGET_BRANCH"
          git push origin HEAD:"$TARGET_BRANCH"

      - name: Upload immutable recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l17-history-recovery-evidence
          path: |
            .build/l17-history/AI_for_the_Kingdom_L17_LIBRARY_PUBLICATION_PACKAGE.zip
            .build/l17-history/payload.xz
            .build/l17b-media
            .build/l17b-r2-verify
            src/publications/releases/ai-for-the-kingdom/1.0.0-rc4.yaml
          if-no-files-found: ignore
          retention-days: 30
