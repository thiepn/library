name: Accessibility Acceptance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: rr6-accessibility-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  accessibility-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup pnpm and Node
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          version: 11.21.0
          runtime: node@22.12.0
          install: false
          cache: true

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Certify RR6 source ownership and evidence boundaries
        run: pnpm certify:accessibility

      - name: Install browser engines and system dependencies
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Build static Library
        run: pnpm build

      - name: Run cross-engine accessibility acceptance
        id: accessibility
        run: pnpm test:accessibility

      - name: Upload failed accessibility evidence
        if: failure() && steps.accessibility.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-accessibility-report-${{ github.run_id }}
          path: |
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 14
