name: Recover RR6 tap projection

on:
  push:
    branches:
      - 'autopilot/deploy-recovery-35166732455'
    paths:
      - '.github/workflows/recover-rr6-tap-projection.yml'

permissions:
  contents: write

concurrency:
  group: recover-rr6-tap-projection-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair-and-certify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Setup pnpm and Node
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          version: 11.21.0
          runtime: node@22.12.0
          install: false
          cache: true

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Repair physical tap coordinate precedence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('src/lib/reader/engines/epubjs.ts')
          text = path.read_text()
          marker = "  // For a real touch gesture, screenX is anchored to the physical visible screen rather"
          end_marker = "\n\n\n  try {"
          if text.count(marker) != 1:
              raise SystemExit(f'expected exactly one early screen-coordinate block, found {text.count(marker)}')
          start = text.index(marker)
          end = text.index(end_marker, start)
          block = text[start:end]
          required = ["pointerType === 'touch'", 'screenX <= screenWidth', 'return clampRatio(physicalX / visibleWidth)']
          missing = [needle for needle in required if needle not in block]
          if missing:
              raise SystemExit(f'early screen-coordinate block did not match expected implementation: {missing}')
          updated = text[:start] + '  try {' + text[end + len(end_marker):]
          if updated == text:
              raise SystemExit('tap-coordinate repair produced no change')
          path.write_text(updated)
          PY
          git diff --check
          git diff -- src/lib/reader/engines/epubjs.ts

      - name: Certify release graph
        run: pnpm release:certify

      - name: Install browser engines and system dependencies
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Qualify hosted EPUB tap zones on Chromium phone
        id: targeted
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p .build/rr6-diagnostics
          set +e
          pnpm exec playwright test tests/e2e/reader-tap-zones.spec.ts --project=chromium-phone --reporter=line --trace=on 2>&1 | tee .build/rr6-diagnostics/targeted.log
          status=${PIPESTATUS[0]}
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Re-run complete local RR6 acceptance
        id: full
        if: steps.targeted.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p .build/rr6-diagnostics
          set +e
          pnpm test:accessibility 2>&1 | tee .build/rr6-diagnostics/full.log
          status=${PIPESTATUS[0]}
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Collect RR6 diagnostic evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build/rr6-diagnostics
          printf 'targeted_outcome=%s\ntargeted_status=%s\nfull_outcome=%s\nfull_status=%s\n' \
            '${{ steps.targeted.outcome }}' '${{ steps.targeted.outputs.status }}' \
            '${{ steps.full.outcome }}' '${{ steps.full.outputs.status }}' \
            > .build/rr6-diagnostics/status.txt
          if [ -d test-results ]; then cp -R test-results .build/rr6-diagnostics/test-results; fi
          if [ -d playwright-report ]; then cp -R playwright-report .build/rr6-diagnostics/playwright-report; fi
          git diff -- src/lib/reader/engines/epubjs.ts > .build/rr6-diagnostics/repair.diff

      - name: Upload RR6 diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rr6-tap-recovery-${{ github.run_id }}
          path: .build/rr6-diagnostics
          if-no-files-found: error
          retention-days: 30

      - name: Require complete local RR6 success
        shell: bash
        run: |
          set -euo pipefail
          test '${{ steps.targeted.outcome }}' = 'success'
          test '${{ steps.full.outcome }}' = 'success'
          test '${{ steps.targeted.outputs.status }}' = '0'
          test '${{ steps.full.outputs.status }}' = '0'

      - name: Commit certified repair and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/recover-rr6-tap-projection.yml
          git add src/lib/reader/engines/epubjs.ts
          git commit -m 'fix: prefer EPUB viewport projection for physical taps'
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
