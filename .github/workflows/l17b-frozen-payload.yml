name: L17B-2 Frozen Payload Injection

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub release tag containing the frozen package ZIP
        required: true
        default: l17b-frozen-payload
      publish_r2:
        description: Upload and verify immutable R2 objects
        required: true
        type: boolean
        default: true
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - .l17b-release-trigger

permissions:
  contents: write

concurrency:
  group: l17b-frozen-payload
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.release.tag_name == 'l17b-frozen-payload'
    runs-on: ubuntu-latest
    env:
      PACKAGE: incoming/AI_for_the_Kingdom_L17_LIBRARY_PUBLICATION_PACKAGE.zip
      MEDIA_DIR: .build/l17b-media
      R2_VERIFY_DIR: .build/l17b-r2-verify
      R2_BUCKET: thiepn-library-publications
      R2_PREFIX: works/ai-for-the-kingdom/editions/1.0.0-rc4
      RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event_name == 'workflow_dispatch' && inputs.release_tag || 'l17b-frozen-payload' }}
      DRIVE_FALLBACK_ID: 1VNGvbEoeI91harOZZ2dYE3apKhoIwCzk
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm and Node
        uses: pnpm/setup@v2
        with:
          version: 11.21.0
          runtime: node@22.12.0
          install: false
          cache: true

      - id: package
        name: Obtain and verify exact frozen package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf incoming
          mkdir -p incoming

          set +e
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'AI_for_the_Kingdom_L17_LIBRARY_PUBLICATION_PACKAGE.zip' --dir incoming
          RELEASE_RC=$?
          set -e

          if [ "$RELEASE_RC" -ne 0 ] || [ ! -f "$PACKAGE" ]; then
            echo 'GitHub Release asset unavailable; trying temporary verified Drive fallback.'
            rm -f "$PACKAGE"
            curl --fail --location --retry 2 --retry-delay 2 \
              "https://drive.usercontent.google.com/download?id=${DRIVE_FALLBACK_ID}&export=download&confirm=t" \
              --output "$PACKAGE"
          fi

          test -f "$PACKAGE"
          test "$(stat -c %s "$PACKAGE")" = '2034059'
          echo '1c6f831ca9c3a48031121dc6129d39cb66f5ad521d53c3e9f40153f8c9f776b7  incoming/AI_for_the_Kingdom_L17_LIBRARY_PUBLICATION_PACKAGE.zip' | sha256sum -c -

      - id: install
        name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - id: inject
        name: Inject frozen package
        run: node scripts/l17b-inject-package.mjs "$PACKAGE"

      - id: verify
        name: Verify package, reader and local binaries
        run: L17B_PACKAGE="$PACKAGE" L17B_MEDIA_DIR="$MEDIA_DIR" pnpm l17b:verify

      - id: creds
        name: Verify Cloudflare credentials
        if: ${{ github.event_name == 'release' || github.event_name == 'push' || inputs.publish_r2 }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - id: upload
        name: Ensure R2 bucket and upload immutable objects
        if: ${{ github.event_name == 'release' || github.event_name == 'push' || inputs.publish_r2 }}
        run: |
          if ! pnpm exec wrangler r2 bucket list | grep -Fq "$R2_BUCKET"; then
            echo "R2 bucket $R2_BUCKET does not exist; creating it."
            pnpm exec wrangler r2 bucket create "$R2_BUCKET"
          fi
          pnpm exec wrangler r2 object put "$R2_BUCKET/$R2_PREFIX/AI_for_the_Kingdom_ONLINE_EDITION.pdf" --file="$MEDIA_DIR/AI_for_the_Kingdom_ONLINE_EDITION.pdf" --content-type='application/pdf' --cache-control='public, max-age=31536000, immutable' --remote
          pnpm exec wrangler r2 object put "$R2_BUCKET/$R2_PREFIX/AI_for_the_Kingdom.epub" --file="$MEDIA_DIR/AI_for_the_Kingdom.epub" --content-type='application/epub+zip' --content-disposition='attachment; filename="AI_for_the_Kingdom.epub"' --cache-control='public, max-age=31536000, immutable' --remote
          pnpm exec wrangler r2 object put "$R2_BUCKET/$R2_PREFIX/ai-for-the-kingdom.webp" --file="$MEDIA_DIR/ai-for-the-kingdom.webp" --content-type='image/webp' --cache-control='public, max-age=31536000, immutable' --remote

      - id: readback
        name: Download R2 objects back and verify exact hashes
        if: ${{ github.event_name == 'release' || github.event_name == 'push' || inputs.publish_r2 }}
        run: |
          rm -rf "$R2_VERIFY_DIR" && mkdir -p "$R2_VERIFY_DIR"
          pnpm exec wrangler r2 object get "$R2_BUCKET/$R2_PREFIX/AI_for_the_Kingdom_ONLINE_EDITION.pdf" --file="$R2_VERIFY_DIR/AI_for_the_Kingdom_ONLINE_EDITION.pdf" --remote
          pnpm exec wrangler r2 object get "$R2_BUCKET/$R2_PREFIX/AI_for_the_Kingdom.epub" --file="$R2_VERIFY_DIR/AI_for_the_Kingdom.epub" --remote
          pnpm exec wrangler r2 object get "$R2_BUCKET/$R2_PREFIX/ai-for-the-kingdom.webp" --file="$R2_VERIFY_DIR/ai-for-the-kingdom.webp" --remote
          L17B_MEDIA_DIR="$R2_VERIFY_DIR" pnpm l17b:verify
          printf 'R2 readback verified against frozen L17 hashes\n' > "$R2_VERIFY_DIR/.r2-verified"

      - id: registry
        name: Write canonical release registry
        if: ${{ github.event_name == 'release' || github.event_name == 'push' || inputs.publish_r2 }}
        run: L17B_R2_MEDIA_DIR="$R2_VERIFY_DIR" node scripts/l17b-write-release.mjs

      - id: certify
        name: Full release certification
        if: ${{ github.event_name == 'release' || github.event_name == 'push' || inputs.publish_r2 }}
        run: L17B_PACKAGE="$PACKAGE" L17B_MEDIA_DIR="$R2_VERIFY_DIR" pnpm release:certify

      - id: promote
        name: Commit verified materialization
        if: ${{ github.event_name == 'release' || github.event_name == 'push' || inputs.publish_r2 }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml src/content/works/ai-for-the-kingdom/chapters src/publications/releases/ai-for-the-kingdom/1.0.0-rc4.yaml
          git diff --cached --quiet && exit 0
          git commit -m 'Materialize verified AI for the Kingdom publication payload'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Record L17B run outcome
        if: always()
        env:
          PACKAGE_OUTCOME: ${{ steps.package.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          INJECT_OUTCOME: ${{ steps.inject.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          CREDS_OUTCOME: ${{ steps.creds.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          READBACK_OUTCOME: ${{ steps.readback.outcome }}
          REGISTRY_OUTCOME: ${{ steps.registry.outcome }}
          CERTIFY_OUTCOME: ${{ steps.certify.outcome }}
          PROMOTE_OUTCOME: ${{ steps.promote.outcome }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git checkout -B l17b-run-status origin/main
          mkdir -p docs
          cat > docs/L17B_RUN_STATUS.md <<EOF
          # L17B latest run status

          Trigger: ${GITHUB_EVENT_NAME}
          Run: ${GITHUB_RUN_ID}
          Source SHA: ${GITHUB_SHA}
          Release tag: ${RELEASE_TAG}

          | Stage | Outcome |
          | --- | --- |
          | package | ${PACKAGE_OUTCOME} |
          | install | ${INSTALL_OUTCOME} |
          | inject | ${INJECT_OUTCOME} |
          | verify | ${VERIFY_OUTCOME} |
          | credentials | ${CREDS_OUTCOME} |
          | R2 upload | ${UPLOAD_OUTCOME} |
          | R2 readback | ${READBACK_OUTCOME} |
          | registry | ${REGISTRY_OUTCOME} |
          | certification | ${CERTIFY_OUTCOME} |
          | promotion | ${PROMOTE_OUTCOME} |
          EOF
          git add docs/L17B_RUN_STATUS.md
          git diff --cached --quiet && exit 0
          git commit -m 'Record L17B publication run outcome'
          git push origin HEAD:main

      - name: Upload certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l17b-2-certification-evidence
          path: |
            .build/certification
            src/content/works/ai-for-the-kingdom/recovery/l17-original-release-registry.yaml
            src/publications/releases/ai-for-the-kingdom/1.0.0-rc4.yaml
          if-no-files-found: ignore
          retention-days: 30
