name: ER6 activity integration

on:
  push:
    branches: [er6-unified-reading-activity]
    paths:
      - .github/workflows/er6-apply.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
