name: ER6 activity integration

on:
  push:
    branches: [er6-unified-reading-activity]
    paths:
      - .github/workflows/er6-apply.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: er6-unified-reading-activity
          fetch-depth: 0
      - name: Apply ER6 integration
        run: python .github/scripts/er6_apply.py
      - name: Commit ER6 integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src scripts package.json
          git diff --cached --quiet && exit 0
          git commit -m "ER6 integrate unified reading activity and Library state"
          git pull --rebase origin er6-unified-reading-activity
          git push origin HEAD:er6-unified-reading-activity
