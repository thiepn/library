export type ReadingActivitySource = 'hosted' | 'personal';

export interface ReadingActivityRecordV1 {
  schemaVersion: 1;
  workId: string;
  edition: number;
  releaseVersion: string;
  format: ReadingActivityFormat;
  source: ReadingActivitySource;
  openedAt: string;
