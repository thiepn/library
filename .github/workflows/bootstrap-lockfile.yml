name: Bootstrap pnpm lockfile

on:
  push:
    branches: [main]
    paths:
      - package.json
      - .github/workflows/bootstrap-lockfile.yml
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-pnpm-lockfile-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
  cancel-in-progress: false

jobs:
  lockfile:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
      - name: Setup pnpm and Node
        uses: pnpm/setup@v2
        with:
          version: 11.21.0
          runtime: node@22.12.0
          install: false
      - name: Generate lockfile
        run: pnpm install --lockfile-only
      - name: Verify frozen install resolves
        run: pnpm install --frozen-lockfile
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git diff --cached --quiet && exit 0
          git commit -m "Generate pnpm lockfile"
          git pull --rebase origin "$TARGET_BRANCH"
          git push origin HEAD:"$TARGET_BRANCH"
