name: Recover staged RR6 touch geometry

on:
  push:
    branches:
      - 'autopilot/recovery-rr6-touch-*'
    paths:
      - '.github/workflows/recover-rr6-touch.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Setup pnpm and Node
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          version: 11.21.0
          runtime: node@22.12.0
          install: false
          cache: true

      - name: Patch translated EPUB touch geometry
        shell: bash
        run: |
          set -euo pipefail
          python scripts/recover-rr6-touch.py
          git diff --check
          grep -q "TOUCH_GEOMETRY_TOLERANCE_PX" src/lib/reader/engines/epubjs.ts

      - name: Build repaired exact tree
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm build

      - name: Commit repair and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/recover-rr6-touch.yml scripts/recover-rr6-touch.py
          git add src/lib/reader/engines/epubjs.ts
          git commit -m 'fix: normalize translated EPUB touch coordinates'
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
