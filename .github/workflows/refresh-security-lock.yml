name: Refresh security lockfile

on:
  push:
    branches:
      - autopilot/public-domain-34285073607
    paths:
      - package.json
      - pnpm-workspace.yaml
      - .github/workflows/refresh-security-lock.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Setup pnpm and Node
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2
        with:
          version: 11.21.0
          runtime: node@22.12.0
          install: false
          cache: true

      - name: Regenerate and audit lockfile
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --lockfile-only --no-frozen-lockfile
          git diff --exit-code -- package.json pnpm-workspace.yaml
          pnpm audit --prod --audit-level=high

      - name: Commit generated lockfile and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/refresh-security-lock.yml
          git add pnpm-lock.yaml
          git commit -m 'chore: refresh lockfile for security upgrades'
          git push origin HEAD:autopilot/public-domain-34285073607
