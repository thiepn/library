name: v1 Release

on:
  workflow_dispatch:
    inputs:
      expected_source_sha:
        description: Exact 40-character production source SHA to certify and tag
        required: true
        type: string
      physical_evidence_sha:
        description: Exact 40-character commit SHA containing the physical-device evidence snapshot
        required: true
        type: string

concurrency:
  group: v1-release
  cancel-in-progress: false

jobs:
  gate:
    name: Certify v1 source
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
      PHYSICAL_EVIDENCE_SHA: ${{ inputs.physical_evidence_sha }}
      PHYSICAL_RELEASE_REPORT: ${{ github.workspace }}/.build/release/physical-device-release.json
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Require exact immutable inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$PHYSICAL_EVIDENCE_SHA" =~ ^[a-f0-9]{40}$ ]]

      - name: Checkout exact candidate source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.expected_source_sha }}
          fetch-depth: 0

      - name: Checkout exact physical evidence snapshot
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ github.repository }}
          ref: ${{ inputs.physical_evidence_sha }}
          path: .build/physical-evidence
          fetch-depth: 0
          sparse-checkout: |
            evidence/physical-devices/records

      - name: Verify immutable source and evidence provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test "$(git -C .build/physical-evidence rev-parse HEAD)" = "$PHYSICAL_EVIDENCE_SHA"
          git -C .build/physical-evidence merge-base --is-ancestor "$EXPECTED_SOURCE_SHA" "$PHYSICAL_EVIDENCE_SHA"
          unexpected="$({ git -C .build/physical-evidence diff --name-only "$EXPECTED_SOURCE_SHA..$PHYSICAL_EVIDENCE_SHA" || true; } | grep -Ev '^evidence/physical-devices/records/[A-Za-z0-9._-]+\.json$' || true)"
          if [ -n "$unexpected" ]; then
            echo 'Physical evidence snapshot contains changes outside evidence/physical-devices/records/*.json:' >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
          mkdir -p .build/release
          printf '%s\n' "$EXPECTED_SOURCE_SHA" > .build/release/source-sha.txt
          printf '%s\n' "$PHYSICAL_EVIDENCE_SHA" > .build/release/physical-evidence-sha.txt

      - name: Setup pnpm and Node
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          version: 11.21.0
          runtime: node@22.12.0
          install: false
          cache: true

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Certify exact physical-device release evidence snapshot
        run: |
          pnpm certify:physical:release -- \
            --expected-sha "$EXPECTED_SOURCE_SHA" \
            --records "$GITHUB_WORKSPACE/.build/physical-evidence/evidence/physical-devices/records" \
            --report "$PHYSICAL_RELEASE_REPORT"

      - name: Certify RR9 source boundaries
        run: pnpm certify:security

      - name: Audit production dependencies
        run: pnpm security:audit

      - name: Check production licenses
        run: pnpm security:licenses

      - name: Generate release SBOM
        run: pnpm security:sbom

      - name: Run complete source/reader/build certification
        run: pnpm release:certify

      - name: Verify exact production deployment
        run: pnpm verify:production

      - name: Enforce v1 protected-main, evidence, and production-identity gate
        run: |
          pnpm release:v1:gate -- \
            --expected-sha "$EXPECTED_SOURCE_SHA" \
            --physical-evidence-sha "$PHYSICAL_EVIDENCE_SHA" \
            --physical-report "$PHYSICAL_RELEASE_REPORT"

      - name: Upload final v1 release evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v1-release-evidence-${{ inputs.expected_source_sha }}-${{ inputs.physical_evidence_sha }}
          path: |
            .build/security
            .build/release
          if-no-files-found: warn
          retention-days: 90

  tag:
    name: Tag v1.0.0
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
    steps:
      - name: Checkout exact certified source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.expected_source_sha }}
          fetch-depth: 0

      - name: Create immutable v1.0.0 tag
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          if git rev-parse -q --verify refs/tags/v1.0.0 >/dev/null; then
            echo 'v1.0.0 already exists; refusing to move or replace it.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a v1.0.0 -m "Thiepn Library v1.0.0"
          git push origin v1.0.0
