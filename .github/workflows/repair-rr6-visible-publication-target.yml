name: Repair RR6 visible publication target handling

on:
  push:
    branches:
      - 'autopilot/deploy-recovery-35249307539-rr6-visible-target'
    paths:
      - '.github/workflows/repair-rr6-visible-publication-target.yml'

permissions:
  contents: write

concurrency:
  group: repair-rr6-visible-publication-target-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Make EPUB touch hit testing follow the visible paginated column
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/repair_rr6_visible_target.py
          git diff --check
          grep -F 'const isInteractiveVisibleTarget = (x: number, y: number, target: EventTarget | null): boolean =>' src/lib/reader/engines/epubjs.ts
          grep -F 'interactive: isInteractiveVisibleTarget(x, y, target),' src/lib/reader/engines/epubjs.ts
          grep -F 'const interactive = start.interactive || isInteractiveVisibleTarget(x, y, target);' src/lib/reader/engines/epubjs.ts

      - name: Commit repair and self-remove helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/repair-rr6-visible-publication-target.yml
          git rm .github/scripts/repair_rr6_visible_target.py
          git add src/lib/reader/engines/epubjs.ts
          git commit -m 'fix: resolve touch targets in the visible EPUB column'
          git push origin "HEAD:$GITHUB_REF_NAME"
