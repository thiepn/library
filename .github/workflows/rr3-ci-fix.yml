name: RR3 one-shot strict TypeScript repair

on:
  push:
    branches: [release/rr3-publication-compatibility]
    paths:
      - '.github/workflows/rr3-ci-fix.yml'

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: release/rr3-publication-compatibility
          fetch-depth: 0

      - name: Apply strict TypeScript ownership fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          inspector = Path('src/lib/publication-compatibility.ts')
          source = inspector.read_text()
          old = "  const source = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));"
          new = "  const owned = bytes.buffer.slice(bytes.byteOffset, bytes.byteOffset + bytes.byteLength) as ArrayBuffer;\n  const source = new Blob([owned]).stream().pipeThrough(new DecompressionStream('deflate-raw'));"
          assert old in source, 'EPUB decompression ownership line was not found'
          inspector.write_text(source.replace(old, new, 1))

          fixtures = Path('tests/e2e/compatibility-fixtures.ts')
          source = fixtures.read_text()
          old_crc = "CRC_TABLE[(value ^ byte) & 0xff] ^ (value >>> 8)"
          new_crc = "CRC_TABLE[(value ^ byte) & 0xff]! ^ (value >>> 8)"
          assert old_crc in source, 'CRC table ownership line was not found'
          source = source.replace(old_crc, new_crc, 1)
          old_header = "function pdf(objects: PdfObject[], root = 1): Buffer {\n  const chunks: Buffer[] = [Buffer.from('%PDF-1.7\\n%\\xe2\\xe3\\xcf\\xd3\\n', 'binary')];\n  const offsets = new Map<number, number>();\n  let length = chunks[0].length;"
          new_header = "function pdf(objects: PdfObject[], root = 1): Buffer {\n  const header = Buffer.from('%PDF-1.7\\n%\\xe2\\xe3\\xcf\\xd3\\n', 'binary');\n  const chunks: Buffer[] = [header];\n  const offsets = new Map<number, number>();\n  let length = header.length;"
          assert old_header in source, 'PDF fixture header ownership block was not found'
          fixtures.write_text(source.replace(old_header, new_header, 1))

          Path('.github/workflows/rr3-ci-fix.yml').unlink()
          PY

      - name: Commit repaired sources and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'RR3 fix strict TypeScript ownership'
          git push origin HEAD:release/rr3-publication-compatibility
