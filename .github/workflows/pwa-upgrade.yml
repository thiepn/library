name: Temporary PWA Icon Upgrade

on:
  push:
    branches: [pwa-upgrade-worker]
    paths:
      - '.github/workflows/pwa-upgrade.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow cairosvg
      - name: Build production favicon and PWA icon set
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import cairosvg, io, json

          root = Path('.')
          public = root / 'public'
          app_svg = (public / 'app-icon.svg').read_bytes()
          mask_svg = (public / 'app-icon-maskable.svg').read_bytes()

          def render(svg, size):
              data = cairosvg.svg2png(bytestring=svg, output_width=size, output_height=size)
              return Image.open(io.BytesIO(data)).convert('RGBA')

          render(app_svg, 32).save(public / 'favicon-32.png', 'PNG', optimize=True)
          render(app_svg, 180).save(public / 'apple-touch-icon.png', 'PNG', optimize=True)
          render(app_svg, 192).save(public / 'icon-192.png', 'PNG', optimize=True)
          render(app_svg, 512).save(public / 'icon-512.png', 'PNG', optimize=True)
          render(mask_svg, 512).save(public / 'icon-maskable-512.png', 'PNG', optimize=True)
          render(app_svg, 256).convert('RGB').save(public / 'favicon.ico', 'ICO', sizes=[(16,16),(32,32),(48,48),(64,64)])

          manifest_path = public / 'manifest.webmanifest'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['icons'] = [
            {'src':'/library/icon-192.png','sizes':'192x192','type':'image/png','purpose':'any'},
            {'src':'/library/icon-512.png','sizes':'512x512','type':'image/png','purpose':'any'},
            {'src':'/library/icon-maskable-512.png','sizes':'512x512','type':'image/png','purpose':'maskable'}
          ]
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')

          layout_path = root / 'src' / 'layouts' / 'BaseLayout.astro'
          layout = layout_path.read_text(encoding='utf-8')
          anchor = '    <link rel="icon" href={href(\'/favicon.svg\')} type="image/svg+xml" />'
          additions = '''\n    <link rel="icon" href={href('/favicon-32.png')} type="image/png" sizes="32x32" />\n    <link rel="apple-touch-icon" href={href('/apple-touch-icon.png')} />'''
          if "apple-touch-icon" not in layout:
              layout = layout.replace(anchor, anchor + additions, 1)
          layout_path.write_text(layout, encoding='utf-8')

          data = json.loads(manifest_path.read_text())
          assert any(i.get('purpose') == 'maskable' for i in data['icons'])
          for file, expected in [('favicon-32.png',(32,32)),('apple-touch-icon.png',(180,180)),('icon-192.png',(192,192)),('icon-512.png',(512,512)),('icon-maskable-512.png',(512,512))]:
              assert Image.open(public/file).size == expected
          assert 'apple-touch-icon' in layout
          print('Thiepn Library icon validation passed')
          PY
      - name: Commit generated icon upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public src/layouts/BaseLayout.astro
          git commit -m "Add production favicon and PWA icons" || exit 0
          git push origin HEAD:pwa-upgrade-worker
