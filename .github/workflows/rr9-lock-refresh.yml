name: RR9 Lockfile Refresh

on:
  pull_request:
    paths:
      - package.json
      - pnpm-workspace.yaml
      - .github/workflows/rr9-lock-refresh.yml

permissions:
  contents: write

concurrency:
  group: rr9-lock-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: pnpm/setup@v2
        with:
          version: 11.21.0
          runtime: node@22.12.0
          install: false
          cache: false
      - name: Resolve patched dependency graph
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit refreshed lockfile
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git diff --exit-code -- pnpm-lock.yaml && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git commit -m 'Refresh lockfile for RR9 dependency hardening'
          git push origin HEAD:${HEAD_REF}
