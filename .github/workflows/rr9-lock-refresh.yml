name: RR9 Lock Refresh

on:
  push:
    branches: [rr9-security-v1-launch]
    paths:
      - 'pnpm-workspace.yaml'
      - '.github/workflows/rr9-lock-refresh.yml'

permissions:
  contents: write

concurrency:
  group: rr9-lock-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout RR9 branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: rr9-security-v1-launch
          fetch-depth: 0

      - name: Setup pnpm and Node
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          version: 11.21.0
          runtime: node@22.12.0
          install: false
          cache: true

      - name: Resolve patched overrides without running dependency scripts
        run: pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile

      - name: Verify patched dependency audit
        run: pnpm audit --prod --audit-level=high

      - name: Commit generated lockfile to RR9 branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo 'Lockfile already matches patched overrides.'
            exit 0
          fi
          git commit -m 'Refresh lockfile for RR9 patched dependencies'
          git push origin HEAD:rr9-security-v1-launch
