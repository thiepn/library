name: Curated Canon Overhaul

on:
  push:
    branches: [main]
    paths:
      - '.github/curated-canon-trigger'
  workflow_dispatch:
    inputs:
      max_books:
        description: Maximum new globally eligible books to add in this run
        required: false
        default: '300'

permissions:
  contents: write

concurrency:
  group: curated-canon-overhaul
  cancel-in-progress: true

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    outputs:
      added_count: ${{ steps.ingest.outputs.added_count }}
      work_ids: ${{ steps.ingest.outputs.work_ids }}
      branch: ${{ steps.checkpoint.outputs.branch }}
    steps:
      - name: Checkout Library
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Setup pnpm and Node
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          version: 11.21.0
          runtime: node@22.12.0
          install: false
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile catalog tooling
        run: |
          python3 -m py_compile \
            scripts/public-domain/catalog_metadata.py \
            scripts/public-domain/clean-existing-catalog.py \
            scripts/public-domain/run-canon.py \
            scripts/public-domain/finalize-cover-release.py

      - name: Normalize all existing public-domain catalog metadata
        run: python3 scripts/public-domain/clean-existing-catalog.py

      - name: Ingest every resolvable globally eligible curated classic
        id: ingest
        env:
          MAX_BOOKS: ${{ github.event.inputs.max_books || '300' }}
        run: |
          set -euo pipefail
          python3 scripts/public-domain/run-canon.py \
            --max-books "$MAX_BOOKS" \
            --max-candidate-checks 650

      - name: Checkpoint metadata and staged manifests
        id: checkpoint
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          branch="autopilot/curated-canon-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git add \
            src/content/works \
            src/publications/releases \
            src/publications/public-domain-ledger.json \
            public/covers/public-domain
          if ! git diff --cached --quiet; then
            git commit -m "Canon checkpoint: normalize metadata and stage curated works"
          fi
          git push origin "HEAD:$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "CHECKPOINT_BRANCH $branch"

      - name: Persist staged EPUB payload for finalization
        if: steps.ingest.outputs.added_count != '0'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: curated-canon-staging-${{ github.run_id }}
          path: .public-domain-staging
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Write ingest summary
        if: always()
        run: |
          {
            echo "### Curated canon ingest checkpoint"
            echo
            echo "- Existing public-domain metadata normalized"
            echo "- Added this run: `${{ steps.ingest.outputs.added_count || '0' }}`"
            echo "- Work IDs: `${{ steps.ingest.outputs.work_ids || '' }}`"
            echo "- Checkpoint branch: `${{ steps.checkpoint.outputs.branch || 'not-created' }}`"
            echo "- New EPUB staging persisted before cover generation"
          } >> "$GITHUB_STEP_SUMMARY"

  finalize:
    needs: ingest
    if: needs.ingest.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_BUCKET: thiepn-library-publications
      COVER_IMAGE_MODEL: gpt-image-2
      COVER_IMAGE_QUALITY: medium
      COVER_IMAGE_SIZE: 1024x1536
      CHECKPOINT_BRANCH: ${{ needs.ingest.outputs.branch }}
      ADDED_COUNT: ${{ needs.ingest.outputs.added_count }}
    steps:
      - name: Checkout checkpoint
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ needs.ingest.outputs.branch }}

      - name: Setup pnpm and Node
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          version: 11.21.0
          runtime: node@22.12.0
          install: false
          cache: true

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          python3 -m pip install --disable-pip-version-check 'Pillow==11.3.0'

      - name: Require publication credentials
        if: env.ADDED_COUNT != '0'
        run: |
          set -euo pipefail
          test -n "${OPENAI_API_KEY:-}"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${R2_BUCKET:-}"

      - name: Restore staged EPUB payload
        if: env.ADDED_COUNT != '0'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: curated-canon-staging-${{ github.run_id }}
          path: .public-domain-staging

      - name: Generate book-specific covers and embed them into new EPUBs
        if: env.ADDED_COUNT != '0'
        run: python3 scripts/public-domain/cover_job.py --new-staging

      - name: Finalize content-addressed cover releases
        if: env.ADDED_COUNT != '0'
        run: python3 scripts/public-domain/finalize-cover-release.py --mode new

      - name: Certify the complete Library
        run: pnpm release:certify

      - name: Upload new immutable EPUBs to R2 and verify readback
        if: env.ADDED_COUNT != '0'
        run: |
          set -euo pipefail
          mkdir -p /tmp/canon-readback
          python3 - <<'PY' > /tmp/canon-artifacts.tsv
          import json
          from pathlib import Path
          items = json.loads(Path('.public-domain-staging/artifacts.json').read_text())
          for item in items:
              print('\t'.join([
                  item['localPath'],
                  item['r2Key'],
                  str(item['sizeBytes']),
                  item['sha256'],
              ]))
          PY

          while IFS=$'\t' read -r local_path key bytes hash; do
            test -f "$local_path"
            filename="$(basename "$local_path")"
            readback="/tmp/canon-readback/$filename"
            pnpm exec wrangler r2 object put "$R2_BUCKET/$key" --file="$local_path" --remote
            pnpm exec wrangler r2 object get "$R2_BUCKET/$key" --file="$readback" --remote
            test "$(stat -c %s "$readback")" = "$bytes"
            printf '%s  %s\n' "$hash" "$readback" | sha256sum -c -
            echo "R2_VERIFIED $key"
          done < /tmp/canon-artifacts.tsv

      - name: Commit finalized covers and releases
        run: |
          set -euo pipefail
          rm -rf .public-domain-staging
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/content/works \
            src/publications/releases \
            src/publications/public-domain-ledger.json \
            public/covers/public-domain
          if ! git diff --cached --quiet; then
            git commit -m "Library: finalize curated canon covers and releases"
            git push origin "HEAD:$CHECKPOINT_BRANCH"
          fi

      - name: Promote certified checkpoint to main
        run: |
          set -euo pipefail
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            git rebase origin/main
          fi
          git push origin HEAD:main
          git push origin --delete "$CHECKPOINT_BRANCH" || true

      - name: Write final summary
        if: always()
        run: |
          {
            echo "### Curated canon finalization"
            echo
            echo "- Reader-facing Gutenberg branding removed"
            echo "- Original publication dates fail closed when not verified"
            echo "- New covers use safe retry and deterministic per-book fallback"
            echo "- New globally eligible editions rights-screened before publication"
            echo "- Immutable EPUBs are uploaded to R2 only after certification"
            echo "- Protected, Germany-only, and translation-review titles remain unpublished"
          } >> "$GITHUB_STEP_SUMMARY"
