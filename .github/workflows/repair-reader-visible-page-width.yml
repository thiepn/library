name: Repair reader visible page width

on:
  push:
    branches:
      - 'repair/reader-touch-visible-ratio-34751544799'
    paths:
      - '.github/workflows/repair-reader-visible-page-width.yml'

permissions:
  contents: write

concurrency:
  group: repair-reader-visible-page-width-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Repair wide paginated iframe tap normalization
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/lib/reader/engines/epubjs.ts')
          text = path.read_text()
          needle = """  const localWidth = Math.max(1, win.innerWidth || doc.documentElement?.clientWidth || 1);\n  const localRatio = clampRatio(clientX / localWidth);\n\n  try {\n"""
          replacement = """  const localWidth = Math.max(1, win.innerWidth || doc.documentElement?.clientWidth || 1);\n  const localRatio = clampRatio(clientX / localWidth);\n\n  // In EPUB.js paginated mode the iframe viewport can span the entire multi-page strip\n  // while the publication body remains one visible page wide. Browser touch events can\n  // still report clientX in that visible-page coordinate space. Treat that coordinate\n  // as authoritative before dividing by the much wider iframe; otherwise a physical\n  // right-edge tap (for example 310px in a 370px page inside an 1850px iframe) is\n  // misclassified as a left-edge tap. This is deliberately not modulo arithmetic: when\n  // an engine reports strip-local coordinates, page stride/gap geometry must be resolved\n  // by the parent-frame/screen fallbacks below rather than guessed.\n  const publicationPageWidth = Number(doc.body?.getBoundingClientRect().width || doc.body?.clientWidth || 0);\n  if (\n    Number.isFinite(publicationPageWidth)\n    && publicationPageWidth > 1\n    && localWidth > publicationPageWidth * 1.25\n    && Number.isFinite(clientX)\n  ) {\n    const pageTolerance = Math.max(3, publicationPageWidth * 0.03);\n    if (clientX >= -pageTolerance && clientX <= publicationPageWidth + pageTolerance) {\n      return clampRatio(clientX / publicationPageWidth);\n    }\n  }\n\n  try {\n"""
          if needle not in text:
              raise SystemExit('expected physicalTapXRatio anchor not found; refusing to patch')
          if 'const publicationPageWidth = Number(' in text:
              raise SystemExit('wide-page repair already present; refusing duplicate patch')
          path.write_text(text.replace(needle, replacement, 1))
          PY
          git diff --check
          git diff -- src/lib/reader/engines/epubjs.ts

      - name: Commit repair and self-remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/repair-reader-visible-page-width.yml
          git add src/lib/reader/engines/epubjs.ts
          git commit -m 'fix: normalize taps against visible EPUB page width'
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
