name: Apply reader touch geometry repair

on:
  push:
    branches:
      - repair/reader-touch-visible-ratio-34751544799
    paths:
      - .github/workflows/repair-reader-touch-geometry.yml

permissions:
  contents: write

concurrency:
  group: repair-reader-touch-geometry-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Apply fail-closed touch geometry repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          source_path = Path('src/lib/reader/engines/epubjs.ts')
          source = source_path.read_text()
          replacement = r'''function physicalTapXRatio(
            win: Window,
            doc: Document,
            clientX: number,
            screenX?: number,
          ): number {
            const localWidth = Math.max(1, win.innerWidth || doc.documentElement?.clientWidth || 1);
            const localRatio = clampRatio(clientX / localWidth);

            try {
              const frame = win.frameElement as HTMLElement | null;
              const viewport = frame?.closest?.('[data-reader-viewport]') as HTMLElement | null;
              const parentWin = viewport?.ownerDocument.defaultView;
              const frameRect = frame?.getBoundingClientRect();
              const viewportRect = viewport?.getBoundingClientRect();
              const visibleWidth = viewportRect?.width;
              if (
                frameRect
                && viewportRect
                && parentWin
                && typeof visibleWidth === 'number'
                && Number.isFinite(visibleWidth)
                && visibleWidth > 1
              ) {
                const tolerance = Math.max(3, visibleWidth * 0.03);
                const inVisibleRange = (x: number) => x >= -tolerance && x <= visibleWidth + tolerance;
                const visibleRatio = (x: number) => clampRatio(x / visibleWidth);

                // A real touch or mouse event can expose the physical screen coordinate even when
                // EPUB.js reports clientX in the translated multi-page iframe. Accept screenX only
                // when it maps cleanly back inside this reader viewport; otherwise ignore it.
                if (typeof screenX === 'number' && Number.isFinite(screenX) && screenX > 0) {
                  const physicalX = screenX - parentWin.screenX - viewportRect.left;
                  if (inVisibleRange(physicalX)) return visibleRatio(physicalX);
                }

                // Paginated EPUB.js views can be several viewport widths wide. In that case the
                // iframe-local clientX is a content-strip coordinate; wrapping by the visible page
                // stride recovers the physical position within the currently visible page. This
                // also preserves already-visible clientX values because they are below one stride.
                if (Number.isFinite(clientX) && frameRect.width > visibleWidth * 1.5) {
                  const wrappedX = ((clientX % visibleWidth) + visibleWidth) % visibleWidth;
                  if (inVisibleRange(wrappedX)) return visibleRatio(wrappedX);
                }

                // For ordinary single-page frames, project iframe-local CSS geometry into the
                // visible reader. This remains the preferred CSS-only interpretation when screen
                // coordinates are unavailable or intentionally omitted by a synthetic test event.
                const translatedVisibleX = clientX + frameRect.left - viewportRect.left;
                if (inVisibleRange(translatedVisibleX)) return visibleRatio(translatedVisibleX);

                // Some engines already expose clientX in visible-reader coordinates.
                if (inVisibleRange(clientX)) return visibleRatio(clientX);
              }
            } catch {
              // Same-origin frame geometry can be unavailable during teardown; use local CSS.
            }

            return localRatio;
          }
          function mapLocation'''

          pattern = re.compile(r'function physicalTapXRatio\([\s\S]*?\n}\nfunction mapLocation')
          updated, count = pattern.subn(replacement, source, count=1)
          if count != 1:
            raise SystemExit(f'expected one physicalTapXRatio block, replaced {count}')
          source_path.write_text(updated)

          doc_path = Path('docs/READER_TOUCH_GEOMETRY_RECOVERY.md')
          doc = doc_path.read_text()
          old = (
              'The retained RR6 evidence showed that EPUB.js can render a paginated iframe several CSS page widths wide and translate it behind the visible reader viewport. Touch `clientX` can therefore arrive either in iframe-local translated coordinates or already in visible-reader CSS coordinates. The repair resolves normal iframe-local input back into the visible reader using the iframe and reader viewport rectangles, while accepting an already-visible `clientX` only when the geometry-derived coordinate falls outside the reader. Same-origin CSS frame geometry is authoritative when it yields a visible tap; `screenX` is only a final fallback because emulated and physical mobile engines can expose a different screen origin.'
          )
          new = (
              'The retained RR6 evidence showed that EPUB.js can render a paginated iframe several CSS page widths wide and translate it behind the visible reader viewport. Touch `clientX` can therefore arrive as a coordinate in that multi-page content strip or already in visible-reader CSS coordinates. The repair first accepts `screenX` only when it maps cleanly back inside the current reader viewport, then normalizes wide paginated-frame `clientX` by the visible page stride, and finally falls back to same-origin frame projection or already-visible CSS coordinates. This keeps physical taps tied to the visible page without trusting an invalid screen origin or a plausible-but-wrong translated iframe coordinate.'
          )
          if old not in doc:
            raise SystemExit('recovery documentation paragraph did not match expected text')
          doc_path.write_text(doc.replace(old, new, 1))
          PY
          git diff --check

      - name: Commit repair and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/repair-reader-touch-geometry.yml
          git add src/lib/reader/engines/epubjs.ts docs/READER_TOUCH_GEOMETRY_RECOVERY.md
          git commit -m 'fix: normalize visible EPUB tap coordinates'
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
