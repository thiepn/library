name: Apply Library icon v2

on:
  push:
    branches: [library-icon-v2]
    paths:
      - '.github/workflows/library-icon-v2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct and validate icon source
        shell: bash
        run: |
          set -euo pipefail
          cat .github/icon-v2/part*.txt | tr -d '\r\n' | base64 --decode > /tmp/library-icon-v2.png
          echo '37069137d680de76ee0bcbf660e66224ba0a0f1607b4fcdcf3335495f77809b9  /tmp/library-icon-v2.png' | sha256sum --check --strict
          file /tmp/library-icon-v2.png

      - name: Generate production icon family
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet Pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          src = Image.open('/tmp/library-icon-v2.png').convert('RGB')
          if src.size != (512, 512):
              raise SystemExit(f'Unexpected icon source size: {src.size}')

          public = Path('public')
          # Preserve the reviewed 512px artwork byte-for-byte.
          public.joinpath('library-icon-512-v2.png').write_bytes(Path('/tmp/library-icon-v2.png').read_bytes())
          public.joinpath('library-icon-maskable-512-v2.png').write_bytes(Path('/tmp/library-icon-v2.png').read_bytes())

          for size, name in [
              (192, 'library-icon-192-v2.png'),
              (180, 'library-apple-touch-icon-v2.png'),
              (32, 'library-favicon-32-v2.png'),
          ]:
              out = src.resize((size, size), Image.Resampling.LANCZOS)
              out.save(public / name, format='PNG', optimize=True, compress_level=9)
          PY

      - name: Point Library PWA and favicon metadata at v2 artwork
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          manifest_path = Path('public/manifest.webmanifest')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['icons'] = [
              {
                  'src': '/library/library-icon-192-v2.png',
                  'sizes': '192x192',
                  'type': 'image/png',
                  'purpose': 'any',
              },
              {
                  'src': '/library/library-icon-512-v2.png',
                  'sizes': '512x512',
                  'type': 'image/png',
                  'purpose': 'any',
              },
              {
                  'src': '/library/library-icon-maskable-512-v2.png',
                  'sizes': '512x512',
                  'type': 'image/png',
                  'purpose': 'maskable',
              },
          ]
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')

          layout_path = Path('src/layouts/BaseLayout.astro')
          layout = layout_path.read_text(encoding='utf-8')
          old = '''    <link rel="icon" href={href('/favicon.svg')} type="image/svg+xml" />\n    <link rel="icon" href={href('/favicon-32.png')} type="image/png" sizes="32x32" />\n    <link rel="apple-touch-icon" href={href('/apple-touch-icon.png')} />'''
          new = '''    <link rel="icon" href={href('/library-favicon-32-v2.png')} type="image/png" sizes="32x32" />\n    <link rel="apple-touch-icon" href={href('/library-apple-touch-icon-v2.png')} />'''
          if layout.count(old) != 1:
              raise SystemExit('Expected existing Library favicon metadata block not found exactly once')
          layout_path.write_text(layout.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Validate generated PWA icon contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image

          expected = {
              'public/library-favicon-32-v2.png': (32, 32),
              'public/library-apple-touch-icon-v2.png': (180, 180),
              'public/library-icon-192-v2.png': (192, 192),
              'public/library-icon-512-v2.png': (512, 512),
              'public/library-icon-maskable-512-v2.png': (512, 512),
          }
          for path, size in expected.items():
              with Image.open(path) as image:
                  assert image.size == size, (path, image.size, size)
                  assert image.format == 'PNG', (path, image.format)

          manifest = json.loads(Path('public/manifest.webmanifest').read_text())
          sources = {icon['src'] for icon in manifest['icons']}
          assert '/library/library-icon-192-v2.png' in sources
          assert '/library/library-icon-512-v2.png' in sources
          assert '/library/library-icon-maskable-512-v2.png' in sources
          assert any(icon.get('purpose') == 'maskable' for icon in manifest['icons'])

          layout = Path('src/layouts/BaseLayout.astro').read_text()
          assert '/library-favicon-32-v2.png' in layout
          assert '/library-apple-touch-icon-v2.png' in layout
          assert "href={href('/favicon.svg')}" not in layout
          print('Library icon v2 contract: PASS')
          PY

      - name: Remove temporary staging material and commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r .github/icon-v2 .github/workflows/library-icon-v2.yml
          git add public/manifest.webmanifest public/library-favicon-32-v2.png public/library-apple-touch-icon-v2.png public/library-icon-192-v2.png public/library-icon-512-v2.png public/library-icon-maskable-512-v2.png src/layouts/BaseLayout.astro
          git diff --cached --check
          git commit -m 'Use new Library app icon'
          git push origin HEAD:library-icon-v2
