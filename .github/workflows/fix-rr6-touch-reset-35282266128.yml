name: Repair RR6 touch ownership reset

on:
  push:
    branches:
      - 'autopilot/deploy-recovery-35282266128'
    paths:
      - '.github/workflows/fix-rr6-touch-reset-35282266128.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Repair touch ownership teardown reset
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/lib/reader/engines/epubjs.ts')
          text = path.read_text(encoding='utf-8')
          old = '    this.lastTouchTapAt = -Infinity;'
          new = '    this.lastTouchTap = null;'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one stale touch timestamp reset, found {count}')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check

      - name: Commit repair and self-remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-rr6-touch-reset-35282266128.yml
          git add src/lib/reader/engines/epubjs.ts
          git commit -m 'Fix RR6 touch ownership reset'
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
