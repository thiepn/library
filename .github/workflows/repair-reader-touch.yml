name: Repair reader touch geometry

on:
  push:
    branches:
      - repair/reader-touch-clientx-first-e671625
    paths:
      - .github/workflows/repair-reader-touch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Apply visible client coordinate repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/lib/reader/engines/epubjs.ts')
          s = p.read_text()
          screen_marker = "  // For a real touch gesture, screenX is anchored to the physical visible screen rather"
          body_marker = "  // In EPUB.js paginated mode the iframe viewport can span the entire multi-page strip"
          body_start = s.index(body_marker)
          body_end = s.index("\n  try {", body_start)
          body_block = s[body_start:body_end]
          s = s[:body_start] + s[body_end:]
          screen_start = s.index(screen_marker)
          s = s[:screen_start] + body_block + "\n\n" + s[screen_start:]
          if s.count(body_marker) != 1 or s.count(screen_marker) != 1:
              raise SystemExit('touch geometry blocks must remain unique')
          if s.index(body_marker) > s.index(screen_marker):
              raise SystemExit('publication-page clientX must precede physical screen fallback')
          p.write_text(s)
          PY
          git diff --check
          git diff -- src/lib/reader/engines/epubjs.ts
      - name: Commit repair and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/repair-reader-touch.yml
          git add src/lib/reader/engines/epubjs.ts
          git commit -m 'fix: prefer visible EPUB client coordinates'
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
