name: Repair reader touch geometry

on:
  push:
    branches:
      - repair/reader-touch-clientx-first-e671625
    paths:
      - .github/workflows/repair-reader-touch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Apply visible client coordinate repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/lib/reader/engines/epubjs.ts')
          s = p.read_text()
          marker = "  // For a real touch gesture, screenX is anchored to the physical visible screen rather\n"
          start = s.index(marker)
          body_marker = "  // In EPUB.js paginated content can render one iframe several page widths wide\n"
          body_start = s.index(body_marker)
          try_start = s.index("  try {\n", body_start)
          body_block = s[body_start:try_start]
          s = s[:body_start] + s[try_start:]
          start = s.index(marker)
          s = s[:start] + body_block + s[start:]
          p.write_text(s)
          PY
          git diff --check
          git diff -- src/lib/reader/engines/epubjs.ts
      - name: Commit repair and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/repair-reader-touch.yml
          git add src/lib/reader/engines/epubjs.ts
          git commit -m 'fix: prefer visible EPUB client coordinates'
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
