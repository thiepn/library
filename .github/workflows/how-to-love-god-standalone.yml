name: Book 1 standalone source integrity

on:
  pull_request:
    paths:
      - 'src/content/works/how-to-love-god/**'
      - 'src/publications/releases/how-to-love-god/**'
      - 'scripts/certification/how-to-love-god-standalone.mjs'
      - 'scripts/certification/how-to-love-god-rendering.mjs'
      - 'scripts/certification/how-to-love-god-browser.mjs'
      - 'scripts/certification/how-to-love-god-print-epub.mjs'
      - '.github/workflows/how-to-love-god-standalone.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  book1-exact-source:
    name: Exact-head book source and publication registry
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Require exact candidate identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.12.0
      - name: Run isolated source certification without private package or credential
        run: node scripts/certification/how-to-love-god-standalone.mjs
      - name: Install isolated TypeScript test executor
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/book1-test-tools"
          printf '{"private":true,"type":"module"}\n' > "$RUNNER_TEMP/book1-test-tools/package.json"
          npm install --prefix "$RUNNER_TEMP/book1-test-tools" --no-package-lock --ignore-scripts --no-audit --no-fund --no-save tsx@4.20.5 epubjs@0.3.93 @astrojs/markdown-remark@7.3.0 linkedom@0.18.12 @playwright/test@1.62.1 @axe-core/playwright@4.11.1 jszip@3.10.1 @xmldom/xmldom@0.9.12 pdfjs-dist@5.4.530
          ln -s "$RUNNER_TEMP/book1-test-tools/node_modules" ./node_modules
      - name: Render all Book 1 Markdown pages and validate internal links
        run: node scripts/certification/how-to-love-god-rendering.mjs
      - name: Install isolated Chromium
        run: |
          "$RUNNER_TEMP/book1-test-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Run actual Chromium typography, layout, navigation, and accessibility acceptance
        run: node scripts/certification/how-to-love-god-browser.mjs
      - name: Validate real non-release EPUB ZIP and tagged paginated PDF
        run: node scripts/certification/how-to-love-god-print-epub.mjs
      - name: Execute all public-dependency Library regression files
        shell: bash
        run: |
          set -euo pipefail
          # Both Account contract specs depend directly or transitively on
          # private @thiepn/account-session. Do not stub or impersonate it.
          # Their complete tests remain NOT_TESTED until authenticated CI.
          mapfile -t specs < <(find scripts/regression -type f -name '*.test.ts' \
            ! -name 'account-sso.test.ts' \
            ! -name 'account-personal-files.test.ts' | LC_ALL=C sort)
          test "${#specs[@]}" -eq 20
          "$RUNNER_TEMP/book1-test-tools/node_modules/.bin/tsx" --test "${specs[@]}"
